# Builds the Dockerfile and publishes the image to GHCR under the repository's
# own name. The only credential is the workflow's GITHUB_TOKEN; nothing here
# echoes it, and pull requests only build.
#
# Publishes on a vX.Y.Z tag whose commit is on main (X.Y.Z, X.Y, latest), or
# when run by hand from the Actions tab on any branch (<branch>, sha-<short>).
name: Docker image

on:
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (untick to only check that it builds)
        type: boolean
        default: true

# One run per ref: a newer run for the same branch, tag or PR cancels the older one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # A tag push always publishes; a manual run publishes unless its box was
  # unticked; a pull request never does.
  PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: the step below asks whether the tagged commit is on main.
          fetch-depth: 0

      # GitHub cannot trigger on "a tag on main", only on "a tag", so a release
      # cut from any other branch is refused here before anything is built.
      - name: Require a release tag to point at main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z on main  -> X.Y.Z, X.Y, latest
      # manual run      -> <branch>, sha-<short sha>
      # PR              -> pr-N (never pushed)
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
