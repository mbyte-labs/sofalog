<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every other URL in this file and in the bundle is relative (Vite
         base: './'), so they resolve against THIS tag rather than the current
         route. Without it, a two-segment route like /video/history resolves
         ./assets/... to /video/assets/... and the app 404s on a hard refresh.
         The Go server rewrites this href from BASE_URL at startup, which is
         what keeps a sub-path deployment working; '/' is the dev default. -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <!-- iOS ignores manifest icons entirely; this link is what Add to Home
         Screen actually uses. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1e1d" />
    <title>sofalog</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
