<svg width="680" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>sofalog code structure</title>
  <desc>The Go module server/ groups the media features video and games under a features/ directory, while auth stays top-level as a cross-cutting feature. Inside every feature, files follow a strict one-way layering: handlers to service to store. All features depend on a shared infrastructure layer (config, httpx, db, provider, assets, web) and never on each other.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
    <rect x="40" y="40" width="600" height="372" rx="20" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">server/ — module mbyte.ro/sofalog</text>
    <text x="340" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">features never import each other</text>
    <rect x="70" y="110" width="340" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="240" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">features/</text>
    <text x="240" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">video · games</text>
    <rect x="430" y="110" width="180" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="520" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">auth/</text>
    <text x="520" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">kept top-level</text>
    <line x1="240" y1="176" x2="240" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="520" y1="176" x2="520" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <rect x="70" y="198" width="540" height="96" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">file layering inside every feature</text>
    <g>
      <rect x="95" y="234" width="150" height="48" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="170" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">handlers*.go</text>
      <text x="170" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">thin HTTP layer</text>
    </g>
    <g>
      <rect x="265" y="234" width="150" height="48" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">service*.go</text>
      <text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">all domain logic</text>
    </g>
    <g>
      <rect x="435" y="234" width="150" height="48" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="510" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">store*.go</text>
      <text x="510" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">the only SQL</text>
    </g>
    <line x1="247" y1="258" x2="261" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="417" y1="258" x2="431" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="340" y1="296" x2="340" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <rect x="70" y="322" width="540" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Shared infrastructure</text>
    <text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">config · httpx · db · provider · assets · web</text>
  </g>
</svg>
