<svg width="680" viewBox="0 0 680 690" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>sofalog runtime architecture</title>
  <desc>Browser talks to a reverse proxy, which forwards plain HTTP to the single sofalog Go binary. The binary serves the embedded SPA and the JSON API, and runs the asset queue, which is the only component allowed to call TMDB and Steam. All state lives in a data volume holding the SQLite database, permanent assets and a prunable cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="690" fill="#FFFFFF"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
    <g>
      <rect x="170" y="40" width="180" height="56" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="260" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>
      <text x="260" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Svelte SPA, PWA shell</text>
    </g>
    <line x1="260" y1="96" x2="260" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="150" y="130" width="220" height="56" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="260" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Reverse proxy</text>
      <text x="260" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Caddy or nginx, TLS here</text>
    </g>
    <line x1="260" y1="186" x2="260" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="60" y="220" width="400" height="270" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="260" y="246" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">sofalog binary (Go)</text>
    <text x="260" y="264" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">one process, plain HTTP</text>
    <g>
      <rect x="90" y="282" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="260" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Embedded Svelte SPA</text>
      <text x="260" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">go:embed static build</text>
    </g>
    <g>
      <rect x="90" y="346" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="260" y="364" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">JSON API /api/v1</text>
      <text x="260" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">auth · video · games</text>
    </g>
    <g>
      <rect x="90" y="410" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="260" y="428" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Asset queue + jobs</text>
      <text x="260" y="446" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">the only provider caller</text>
    </g>
    <rect x="490" y="264" width="150" height="210" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="565" y="286" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Providers</text>
    <g>
      <rect x="500" y="302" width="130" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
      <text x="565" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">TMDB</text>
    </g>
    <g>
      <rect x="500" y="414" width="130" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
      <text x="565" y="436" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Steam</text>
    </g>
    <line x1="434" y1="436" x2="486" y2="436" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="260" y1="492" x2="260" y2="526" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="60" y="530" width="400" height="118" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
    <text x="260" y="552" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">data/ volume</text>
    <g>
      <rect x="80" y="576" width="110" height="52" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="135" y="594" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">sofalog.db</text>
      <text x="135" y="612" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">SQLite, WAL</text>
    </g>
    <g>
      <rect x="205" y="576" width="110" height="52" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="260" y="594" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">assets/</text>
      <text x="260" y="612" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">permanent</text>
    </g>
    <g>
      <rect x="330" y="576" width="110" height="52" rx="8" fill="#F7F6F1" stroke="#888780" stroke-width="0.75"/>
      <text x="385" y="594" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">cache/</text>
      <text x="385" y="612" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">TTL, pruned</text>
    </g>
  </g>
</svg>
