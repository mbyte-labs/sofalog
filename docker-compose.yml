# sofalog — one app container behind a TLS-terminating reverse proxy.
#
#   docker compose up -d            pull the published image (amd64 + arm64)
#   docker compose up -d --build    build it from this checkout instead
#
# Settings come from ./.env (gitignored; start from env.example). No secrets here.
#
#   cp env.example .env && $EDITOR .env && docker compose up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mbyte-labs/sofalog:latest
    restart: unless-stopped
    environment:
      # Public URL users reach the app at. Links, OIDC redirects and the cookie
      # Secure flag all derive from it.
      BASE_URL: ${BASE_URL:-http://localhost:9871}
      DATA_DIR: /data
      # TMDB: set one of the two (v4 wins if both are set). Without a key,
      # browsing works but adding items fails.
      TMDB_API_KEY_V3: ${TMDB_API_KEY_V3:-}
      TMDB_API_KEY_V4: ${TMDB_API_KEY_V4:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # The reverse proxy's IP or CIDR, comma separated. Empty ignores
      # X-Forwarded-* headers.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # OIDC: set all three or none. Enabling it disables password login.
      # Redirect URI to register: <BASE_URL>/api/v1/auth/oidc/callback
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Optional: the claim and value that grant admin.
      OIDC_ADMIN_CLAIM: ${OIDC_ADMIN_CLAIM:-}
      OIDC_ADMIN_VALUE: ${OIDC_ADMIN_VALUE:-}
      # Optional: default "openid profile email" and "single sign-on".
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
    volumes:
      - ./data:/data
    ports:
      # Plain HTTP on every interface, for a proxy on another machine. Docker
      # bypasses ufw, so restrict access to this port another way.
      - '9871:8080'
