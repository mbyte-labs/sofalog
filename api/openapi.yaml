          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/ratings:
    put:
      operationId: rateMovie
      summary: Set this user's rating of a movie
      description: >
        Ratings are integers 1-10, one per user per target. PUT rather than
        POST because a rating is a single current opinion, not an event:
        re-rating overwrites the stored value and keeps no history (D-009), so
        there is nothing to report about whether a rating already existed.
        Rating counts as a reference (D-008), so it tracks the movie — a
        `tmdb_id` whose movie has no catalog row materialises it from TMDB
        first and enqueues its full media set, and if TMDB is down at that
        moment the call is a 503 and nothing is written. Rating never sets a
        watch status: whether the movie has been seen is derived from the watch
        log alone (D-010), and an opinion is not a claim to have watched it.


        For a user who has linked their TMDB account the change is also
        queued for the one-way push to that account (D-029), in the same
        transaction; the local write never waits on TMDB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRequest"
      responses:
        "200":
          description: The rating now stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResult"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/ratings/{target_type}/{target_id}:
    delete:
      operationId: removeRating
      summary: Clear this user's rating of a target
      description: >
        Idempotent — clearing what was never rated is still a 204 — and never
        a provider call on this request: for a user who has linked their TMDB
        account the removal is queued for the background push (D-029), so
        removing here removes there. The catalog row, its stored artwork and
        any watch history stay even when the rating was the last reference;
        untracking never hard-deletes (D-008), and the deferred sweep collects
        unreferenced items once it lands.
      parameters:
        - name: target_type
          in: path
          required: true
          description: >
            `season` is refused with a 422 (D-020).
          schema:
            type: string
            enum: [movie, show, episode]
        - name: target_id
          in: path
          required: true
          description: Local catalog id in that type's own table.
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The target carries no rating from this user (any more).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/tmdb/link:
    get:
      operationId: getTMDBLink
      summary: This user's TMDB account link
      description: >
        Whether this user has linked their own TMDB account for the one-way
        rating push (D-029). One shape whether linked or not — `linked:
        false` is a 200, never a 404. A pure local read: the username was
        stored at link time, so this never reaches TMDB. The session id TMDB
        issued is deliberately absent; it never leaves the server. Also
        carries the one-time setup's state (D-036): `setup_done`, the three
        ongoing `sync` switches, and `pull` — the setup's pull job for this
        link, running or finished, which the client polls here.
      responses:
        "200":
          description: The link's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TMDBLinkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteTMDBLink
      summary: Unlink the TMDB account
      description: >
        Removes the link and every rating change still waiting to be sent,
        cancels a setup pull still running, then revokes the session at TMDB
        (best effort). Idempotent — unlinking what was never linked is a 204.
        Ratings already on TMDB are left as they are: the account is the
        user's, not sofalog's.
      responses:
        "204":
          description: No TMDB account is linked (any more).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /video/tmdb/link/setup:
    post:
      operationId: setupTMDBSync
      summary: The one-time setup after linking
      description: >
        Once per link, after approving on TMDB, the user says per kind —
        ratings, watchlist, favorites — what to do with what each side
        already holds (D-036). `push` queues everything sofalog holds of that
        kind for the one-way push, once (the former link-time backfill), even
        when the kind's switch is off. `pull` reads TMDB's list of that kind
        once, in a background job: a rated movie, show or episode overwrites
        the local rating (TMDB's half steps rounded half up to 1–10), a
        watchlist or favorite entry is added if absent and never removed; an
        item the library has never seen is materialised through the ordinary
        tracking gate (D-015), and nothing pulled is ever queued back. `skip`
        does nothing now. Each kind's `sync` is the ongoing switch (see PUT
        /video/tmdb/link/sync). Switches and push rows land in one
        transaction; `setup_done` is set at once when nothing pulls and at
        the end of the pull job otherwise, so a failed or interrupted pull
        leaves the setup to be run again — a re-run converges. Answers 202
        with the status, whose `pull` is the job's first snapshot; the job
        lives in memory and a restart forgets it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TMDBSetupRequest"
      responses:
        "202":
          description: The setup was recorded; a pull, if any, is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TMDBLinkStatus"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No TMDB account is linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The link is broken (link again first), the setup has already
            been done for this link, or a pull is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: An `action` is not `pull`, `push` or `skip`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /video/tmdb/link/sync:
    put:
      operationId: setTMDBSyncKinds
      summary: The ongoing-sync switches
      description: >
        Which kinds of local write — ratings, watchlist, favorites — are sent
        to the linked TMDB account from now on (D-036). A switch governs
        FUTURE writes only: turning one on queues nothing already held (the
        setup's `push` is the one backfill), and turning one off deletes
        that kind's rows still waiting to be sent, in the same transaction.
        Allowed while the link is broken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TMDBSyncKinds"
      responses:
        "200":
          description: The switches as stored, with the rest of the status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TMDBLinkStatus"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No TMDB account is linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /video/jellyfin:
    get:
      operationId: getJellyfinStatus
      summary: The Jellyfin library scan's state
      description: >
        Whether this server has a Jellyfin server configured (D-033), what
        that server calls itself, whether a scan is running, the scheduled
        cadence and the last scan's report. One shape whether configured or
        not — `configured: false` is a 200. A pure local read: in-memory
        state, never a call to Jellyfin. The report is forgotten on restart.
      responses:
        "200":
          description: The scan's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /video/jellyfin/scan:
    post:
      operationId: startJellyfinScan
      summary: Scan the Jellyfin server now
      description: >
        Wakes the library scan (D-033) without waiting for its schedule. The
        scan reads every movie, series and episode file the Jellyfin server
        holds, matches them against the catalog by TMDB id, and rewrites the
        shared `jellyfin` copy answer — every user's details pages read it.
        It never calls TMDB and never adds an item to the library. Any
        signed-in user may press it: it is server-wide, idempotent and cheap.
        Poll `GET /video/jellyfin` for the report.
      responses:
        "202":
          description: >
            The scan was started (or was already about to start). The body is
            the state as of now — the poll target's first snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /video/tmdb/link/start:
    get:
      operationId: getTMDBLinkStart
      summary: Begin linking a TMDB account
      description: >
        Redirects the browser to TMDB's approval page for a fresh request
        token. This is a browser-navigation endpoint, not a JSON call: link to
        it or set window.location, do not fetch it. Unlike the single sign-on
        start it REQUIRES the session cookie — the link is attached to the
        signed-in user.


        A failure (no TMDB credential configured, TMDB unreachable) also
        redirects, to the Settings page with `?tmdb_link=<code>`, rather than
        rendering an error envelope at the user.
      responses:
        "302":
          description: >
            Redirect to TMDB's approval page; or, on failure, to
            `settings/tmdb?tmdb_link=provider_unavailable|failed`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Short-lived sofalog_tmdb_link flow cookie binding the request
                token to this user and browser.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /video/tmdb/link/callback:
    get:
      operationId: getTMDBLinkCallback
      summary: TMDB account link callback
      description: >
        Where TMDB sends the browser back — always
        `{BASE_URL}/api/v1/video/tmdb/link/callback`, derived from BASE_URL
        alone. Checks the flow cookie against the signed-in user and the
        returned token, exchanges the token for a session, reads the account's
        username and stores the link. Nothing is queued: the setup that
        follows (POST /video/tmdb/link/setup, D-036) decides what happens to
        what each side already holds. Re-linking the same account keeps its
        setup and switches; a different account resets them and drops the
        old account's pending rows. Always answers with a redirect to
        `settings/tmdb?tmdb_link=<code>`: `ok`, `denied` (refused on TMDB, or
        TMDB refused the token), `expired` (no or stale flow cookie, another
        user's flow, token mismatch), `provider_unavailable`, `failed`.
      parameters:
        - name: request_token
          in: query
          schema:
            type: string
        - name: approved
          in: query
          description: TMDB sets `true` when the user approved.
          schema:
            type: string
        - name: denied
          in: query
          description: TMDB sets `true` when the user refused.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the Settings page carrying `?tmdb_link=`.
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /video/restore/ticket-box:
    post:
      operationId: startTicketBoxRestore
      summary: Import a Ticket Box backup into this user's library
      description: >
        Reads a backup FILE exported by Ticket Box, the user's own Trakt
        client, and folds its watch history, ratings, watchlist and favorites
        into the signed-in user's state (D-023). sofalog never calls Trakt; the
        file is the whole source. Only `schemaVersion` 5 is accepted — version
        1 named episodes by their own TMDB id, which nothing can resolve to a
        show; 3 dropped the Trakt ids, 4 added `favorites`, 5 added `imdbId` —
        and the decode is strict: a field the version does not define is a
        422 naming it.


        Semantics, per movie or show the file names: an item the file has
        **watches** for is replaced — this user's existing watch rows for it
        (every season, for a show) are removed and the file's rows written,
        with the file's `historyType` as `watch_type` and its `addedAt` as
        `watched_at` (normalised to UTC seconds; a future instant is skipped).
        An item the file only rates, watchlists or favorites keeps its
        watches. Ratings upsert with the file's `ratedAt` as `updated_at`;
        watchlist and favorite rows are added if absent, with `listedAt` /
        `favoritedAt` as `added_at`. For a user who has linked their TMDB
        account, all three are queued for the one-way push (D-029). Items not yet in the catalog are materialised from
        TMDB the way every tracking write materialises them (D-015), so a
        whole-library import runs for minutes: the request validates the file
        synchronously, starts the import as a job, and answers 202 with the
        job's first snapshot, which already counts the groups (one per movie
        or show) and the entries validation refused. Poll the GET for
        progress and the final report.


        Entries sofalog cannot take are **skipped and reported, never a
        failure**: a season rating (D-020), a season or episode on the
        watchlist, an entry with no TMDB id, an episode TMDB's listing lacks,
        a show TMDB does not know or could not be fetched. After three
        consecutive provider outages the run stops asking TMDB and skips every
        remaining item that would need a fetch (`provider_unavailable`), while
        items already in the catalog still import.


        One job per user at a time (a second start while one runs is a 409).
        The job lives in server memory: a restart forgets it, the groups it had
        committed stay, and re-running the same file converges on the same end
        state. The body cap is 32 MiB, well above any real export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketBoxDump"
      responses:
        "202":
          description: >
            The file was accepted and the import started. The body is the job's
            first snapshot; its `report.skipped` already lists what validation
            refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreJob"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: getTicketBoxRestore
      summary: This user's running or most recent restore job
      description: >
        The poll target while an import runs, and the report afterwards. A
        finished job stays readable until the same user starts another. 404
        when this user has started none since the server booted — which is
        also what a restart leaves behind.
      responses:
        "200":
          description: The job's current snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /video/movies/{id}/assets/{file}:
    get:
      operationId: getMovieAsset
      summary: Tracked artwork from permanent local storage
      description: >
        Serves one file of a tracked movie's artwork from data/assets — pure
        disk, never a provider call and never the temporary cache: the render
        path that works with every provider down. `file` is the path below the
        movie's asset directory, e.g. `poster.thumb.jpg` or
        `gallery/backdrops/{tmdb_file}.jpg`. Clients never build these URLs:
        the details payload mints one exactly when the file is already on
        disk, falling back to the /video/posters proxy while the download
        queue is still draining.
      parameters:
        - name: id
          in: path
          required: true
          description: Local catalog id (`movies.id`).
          schema:
            type: integer
            format: int64
        - name: file
          in: path
          required: true
          description: >
            Slash-separated path below the movie's asset directory. Plain
            image-file elements only — no dot-elements, no backslashes.
          schema:
            type: string
      responses:
        "200":
          description: The image bytes, cacheable by the browser.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/shows/{id}/assets/{file}:
    get:
      operationId: getShowAsset
      summary: Tracked show artwork from permanent local storage
      description: >
        The show counterpart of `/video/movies/{id}/assets/{file}`, and it
        covers the show's SEASONS and EPISODES too: their artwork lives beneath
        the show's directory, so `seasons/2/poster.jpg` and
        `episodes/2-7/still.thumb.jpg` are served by this one route. That is
        also why there is no season or episode asset route — one would have to
        carry `seasons.id`, which would force a database read onto a pure-disk
        render path.


        Pure disk, never a provider call and never the temporary cache. Clients
        never build these URLs: the details payload mints one exactly when the
        file is already on disk, falling back to the /video/posters proxy while
        the download queue is still draining.
      parameters:
        - name: id
          in: path
          required: true
          description: Local catalog id (`shows.id`).
          schema:
            type: integer
            format: int64
        - name: file
          in: path
          required: true
          description: >
            Slash-separated path below the show's asset directory. Plain
            image-file elements only — no dot-elements, no backslashes. Season
            and episode directories are keyed by POSITIONAL number, never by
            `seasons.id`.
          schema:
            type: string
      responses:
        "200":
          description: The image bytes, cacheable by the browser.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/posters/{size}/{file}:
    get:
      operationId: getVideoPoster
      summary: TMDB image, proxied through the local cache
      description: >
        Serves one TMDB image variant from the server's temporary cache
        (data/cache, keyed by the TMDB filename), fetching it from TMDB on the
        first request. Despite the path this is the whole TMDB image proxy —
        search-result and details-page posters, cast photos, the media
        section's backdrop and poster galleries, and the person page's portrait
        and filmography posters all draw through it. It is how artwork reaches
        the browser without it ever touching a provider URL. Tracked items'
        artwork lives in data/assets and is served separately; a person owns no
        assets, so this cache is the only place its images live (D-027).
      parameters:
        - name: size
          in: path
          required: true
          description: >
            TMDB variant. Posters use w185 (thumb) and w500 (full); backdrops
            have their own ladder and use w300 (thumb) and w1280 (full);
            profiles (a person's portrait) have a third and use w185 (thumb)
            and h632 (full). The set is closed — size goes into both the
            provider URL and the cache path.
          schema:
            type: string
            enum: [w185, w500, w300, w1280, h632]
        - name: file
          in: path
          required: true
          description: >
            The TMDB image filename exactly as it appears in a poster, photo or
            gallery URL. One plain filename — no path separators. "-" and "_"
            are allowed because TMDB's filenames are base64url-ish hashes.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+\.(jpg|jpeg|png)$'
      responses:
        "200":
          description: The image bytes, cacheable by the browser.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/youtube-thumbs/{key}:
    get:
      operationId: getYouTubeThumb
      summary: Video still frame, proxied through the local cache
      description: >
        Serves one video's still frame from the server's temporary cache
        (data/cache, keyed by the YouTube video id), fetching it from YouTube's
        thumbnail CDN on the first request. It exists because TMDB lists videos
        by id and hosts no frames: without the proxy a details page would have
        to embed a provider URL, and every viewer's browser would request an
        image from YouTube directly (D-017). Only ids named by a stored snapshot
        are ever requested. A single variant is stored — mqdefault, 320x180 —
        because YouTube offers no reliable second 16:9 size.
      parameters:
        - name: key
          in: path
          required: true
          description: >
            YouTube video id, exactly as a MovieVideo `thumb` URL carries it —
            eleven base64url characters.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{11}$"
      responses:
        "200":
          description: The JPEG frame, cacheable by the browser.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

components:
  schemas:
    SearchResult:
      description: >
        One TMDB search match, movie or show. Pure provider data — no library
        state, no user state. `tmdb_id` is TMDB's id and is only unique within
        its media type: movie 5 and show 5 both exist, so the pair
        (`media_type`, `tmdb_id`) identifies a result. Nullable fields are
        always present, serialized as null.
      type: object
      required: [media_type, tmdb_id, title, year, overview, rating, poster, poster_full]
      properties:
        media_type:
          type: string
          enum: [movie, show]
        tmdb_id:
          type: integer
          format: int64
        title:
          type: string
        year:
          type: string
          nullable: true
          description: Release/first-air year ("1999"), or null when TMDB has no date.
        overview:
          type: string
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score (0-10), not a user rating; null when TMDB
            reports the item as unrated.
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied thumb
            (api/v1/video/posters/w185/...), or null when TMDB has no poster.
            Never a provider URL.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the full size
            (api/v1/video/posters/w500/...); null exactly when `poster` is.
            Cards offer both through `srcset` and the browser picks by screen
            density and rendered width.
    TrendingEntry:
      description: >
        One title of the trending or popular list (D-034): every
        `SearchResult` field — a foreign title addressed by its TMDB id,
        because the list is live and never stored — plus the person page's
        library marks (D-027), joined locally. The pair (`media_type`,
        `tmdb_id`) identifies an entry. Nullable fields are always present,
        serialized as null.
      allOf:
        - $ref: "#/components/schemas/SearchResult"
        - type: object
          required: [id, watched, in_history]
          properties:
            id:
              type: integer
              format: int64
              nullable: true
              description: >
                The catalog row's local id when the library holds this title
                (the card then links by it, as a watchlist card does), null
                when it does not.
            watched:
              type: boolean
              description: >
                The watchlist page's meaning per kind — movie: any watch in
                the caller's log; show: completed (every aired non-special
                episode, D-012). Always false when `id` is null.
            in_history:
              type: boolean
              description: >
                The looser "seen any of it": the same fact as `watched` for a
                movie, any episode watch at all for a show. Always false when
                `id` is null.
    TrendingPage:
      description: >
        One page of a trending or discover list with TMDB's paging envelope —
        the spec's one paged object (every other list pages by `limit` /
        `offset` and infers the end from a short array). There is more while
        `page < total_pages`; TMDB serves no page past 500.
      type: object
      required: [entries, page, total_pages]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TrendingEntry"
        page:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0
    DiscoverOptions:
      description: >
        The Discover filter panel's option lists, from TMDB (D-034). Genre ids
        are per kind — TMDB's movie and TV genre lists overlap only partly —
        so a client filtering `type=all` offers the union.
      type: object
      required: [genres, languages, providers, region]
      properties:
        genres:
          type: object
          required: [movie, show]
          properties:
            movie:
              type: array
              items:
                $ref: "#/components/schemas/GenreOption"
            show:
              type: array
              items:
                $ref: "#/components/schemas/GenreOption"
        languages:
          type: array
          description: Sorted by English name; TMDB's "No Language" placeholder is dropped.
          items:
            type: object
            required: [code, name]
            properties:
              code:
                type: string
                description: ISO 639-1
              name:
                type: string
        providers:
          type: array
          description: >
            Streaming services TMDB lists for `region`, movies and shows
            merged by id, in TMDB's display order.
          items:
            type: object
            required: [id, name, logo]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
              logo:
                type: string
                nullable: true
                description: >
                  Relative URL of the locally proxied logo
                  (api/v1/video/posters/w185/...), or null. Never a provider URL.
        region:
          type: string
          description: The configured `TMDB_WATCH_REGION` the providers are for.
    GenreOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    MovieDetails:
      description: >
        One movie — from the stored catalog snapshot, or, for an untracked
        `tmdb_id` view, built live from TMDB without storing anything. `id` is
        the local catalog id; `tmdb_id` is TMDB's. Nullable fields are always
        present, serialized as null; arrays are never null. Image URLs come in
        two relative families, interchangeable to clients: the lazy cache
        proxy (`api/v1/video/posters/…`, `api/v1/video/youtube-thumbs/…`) and,
        for tracked artwork already downloaded, permanent storage
        (`api/v1/video/movies/{id}/assets/…`). Never a provider URL.
      type: object
      required:
        [
          id,
          tmdb_id,
          title,
          original_title,
          release_date,
          year,
          runtime_min,
          overview,
          tagline,
          genres,
          rating,
          votes,
          director,
          cast,
          videos,
          backdrops,
          posters,
          poster,
          poster_full,
          homepage,
          imdb_id,
          trailer_url,
          original_language,
          budget,
          revenue,
          popularity,
          fetched_at,
          tracked,
          watched,
          watchlisted,
          user_rating,
          copies,
          streaming,
          similar, jellyfin_synced]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: >
            Local catalog id (`movies.id`), or null when the movie has no
            catalog row — an untracked view served live. Tracking creates the
            row; a client holding null adopts the TrackResult's `target_id`.
        tmdb_id:
          type: integer
          format: int64
        title:
          type: string
        original_title:
          type: string
          nullable: true
        release_date:
          type: string
          nullable: true
          description: YYYY-MM-DD, or null when TMDB has no date.
        year:
          type: string
          nullable: true
          description: Release year ("1999"), derived from `release_date`.
        runtime_min:
          type: integer
          nullable: true
        overview:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score (0-10), not a user rating; null when TMDB
            reports the movie as unrated.
        votes:
          type: integer
          format: int64
          nullable: true
          description: TMDB vote count behind `rating`; null when none.
        director:
          type: string
          nullable: true
        cast:
          type: array
          description: Full credited cast, ordered by billing.
          items:
            $ref: "#/components/schemas/CastMember"
        videos:
          type: array
          description: >
            The media section's Videos tab — every YouTube video TMDB lists,
            ordered the same way `trailer_url` is chosen (a trailer beats a
            teaser, official beats unofficial, then newest), so the first entry
            is the video `trailer_url` points at. Capped at 30.
          items:
            $ref: "#/components/schemas/MovieVideo"
        backdrops:
          type: array
          description: >
            The media section's Backdrops tab (16:9), best-rated first. Capped
            at 30.
          items:
            $ref: "#/components/schemas/MovieImage"
        posters:
          type: array
          description: >
            The media section's Posters tab (2:3), best-rated first. Capped at
            30. These are alternative artwork; the movie's own poster is the
            `poster`/`poster_full` pair.
          items:
            $ref: "#/components/schemas/MovieImage"
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied thumb
            (api/v1/video/posters/w185/...), or null when TMDB has no poster.
            Never a provider URL.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the detail-page size
            (api/v1/video/posters/w500/...); null exactly when `poster` is.
        homepage:
          type: string
          nullable: true
          description: The movie's official site, or null when TMDB has none.
        imdb_id:
          type: string
          nullable: true
          description: >
            IMDb title id ("tt0133093") from TMDB's external ids; clients build
            the IMDb URL from it. Null when TMDB has none.
        trailer_url:
          type: string
          nullable: true
          description: >
            YouTube watch URL of the best video TMDB lists: a trailer beats a
            teaser, official beats unofficial, then the newest wins. Null when
            no YouTube trailer or teaser exists.
        original_language:
          type: string
          nullable: true
          description: ISO 639-1 code of the original language ("en").
        budget:
          type: integer
          format: int64
          nullable: true
          description: Production budget in USD; null when TMDB reports 0 (unknown).
        revenue:
          type: integer
          format: int64
          nullable: true
          description: Worldwide revenue in USD; null when TMDB reports 0 (unknown).
        popularity:
          type: number
          nullable: true
          description: >
            TMDB's relative trending metric (no fixed scale). It is only as
            current as the snapshot — `fetched_at` says when it was last
            refreshed.
        fetched_at:
          type: string
          description: >
            When the snapshot was fetched from TMDB (RFC3339 UTC). Snapshots
            older than 2 days refresh on view.
        tracked:
          type: boolean
          description: >
            Whether ANY user references this movie — a state row, a watchlist
            row, a favorite, a watch, a rating or an owned copy. False on a
            live untracked view.
        watched:
          type: boolean
          description: Whether the requesting user has watched this movie.
        watchlisted:
          type: boolean
          description: Whether the requesting user has this movie watchlisted.
        favorited:
          type: boolean
          description: >
            Whether the requesting user has this movie among their favorites —
            a third independent axis (D-030), orthogonal to `watched` and
            `watchlisted`. False on a live untracked view.
        user_rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
          description: >
            The requesting user's own rating (1-10), or null when they have not
            rated it. Not a provider score — `rating` is TMDB's community
            float. Null on a live untracked view, which carries no user state.
        copies:
          type: array
          items:
            $ref: "#/components/schemas/CopyKind"
          description: >
            The kinds the requesting user holds a copy of this movie on
            (D-021), kind-ordered. Never null; [] on a live untracked view,
            which carries no user state.
        jellyfin_synced:
          type: boolean
          description: >
            Whether a Jellyfin server is configured (D-033), in which case the
            `jellyfin` entry in `copies` is the library scan's answer rather than
            the user's own label, the copy routes refuse that kind, and the
            client renders the tile read-only. Server config on the DTO,
            exactly as `streaming.region` is.
        streaming:
          allOf:
            - $ref: "#/components/schemas/Streaming"
          nullable: true
          description: >
            Where to watch, or null when no listing was available to read — see
            the Streaming schema for why the two empty cases differ.
        similar:
          type: array
          items:
            $ref: "#/components/schemas/SimilarTitle"
          description: >
            TMDB's recommendations for this movie — the "Similar movies" rail
            (D-024) — in TMDB's relevance order, at most 20. Read off the same
            snapshot as the cast, so it renders with TMDB unreachable and is
            only as current as `fetched_at`. Never null: [] both when the
            snapshot has no section yet and when TMDB lists nobody.
    ShowSeason:
      description: >
        One season on the details page's seasons grid. Three fields are the
        requesting user's: `copies` (owned copies live per-season, D-021) and
        the two derived reads the poster badges, `progress` and `user_rating`.
        Everything else is the snapshot's; there is no user status, because a
        season has none (D-010). Nullable fields are always present, serialized
        as null.
      type: object
      required:
        [
          id,
          season_number,
          name,
          episode_count,
          air_date,
          year,
          overview,
          rating,
          poster,
          poster_full,
          copies,
          jellyfin_episodes,
          progress,
          user_rating,
        ]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: >
            Local seasons.id once the show is TRACKED, or null before then —
            only tracking writes season rows (D-015). The grid links by it when
            present, else by (show `tmdb_id`, `season_number`).
        season_number:
          type: integer
          description: TMDB's season number; 0 is Specials.
        name:
          type: string
        episode_count:
          type: integer
          description: Episodes TMDB lists for the season, aired or not.
        air_date:
          type: string
          nullable: true
          description: YYYY-MM-DD of the season premiere, or null when undated.
        year:
          type: string
          nullable: true
          description: Premiere year ("2008"), derived from `air_date`.
        overview:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score for the season (0-10); null when TMDB reports
            it as unrated.
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied thumb
            (api/v1/video/posters/w185/...), or null when the season has no
            poster of its own. Never a provider URL.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the detail size
            (api/v1/video/posters/w500/...); null exactly when `poster` is.
        copies:
          type: array
          items:
            $ref: "#/components/schemas/CopyKind"
          description: >
            The kinds the requesting user holds a copy of THIS season on
            (D-021), kind-ordered. Never null; always [] for an untracked show,
            which has no season rows to hold copies.
        jellyfin_episodes:
          type: integer
          nullable: true
          description: >
            How many of this season's episode files the Jellyfin library scan
            found (D-033). Null when no server is configured or the season is
            not on it. A client compares it with the season's AIRED episodes
            to tell a complete season from a partial one — the tile turns
            amber when some are missing.
        progress:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SeasonProgress"
          description: >
            This season's DERIVED progress (D-010). Present, possibly all
            zeros, for every season of a tracked show; null for an untracked
            show, which has no episode rows to count.
        user_rating:
          type: number
          format: double
          nullable: true
          description: >
            The average of the requesting user's EPISODE ratings in this season
            (1–10, fractional), or null when none is rated or the show is
            untracked. A season is not itself rateable (D-020): this is a
            derived read, never a stored value, which is why it is a number
            where the other `user_rating` fields are integers.
    ShowEpisodeStub:
      description: >
        Names one episode without carrying its full record — enough for the
        "next episode" fact on the details page.
      type: object
      required: [season, number, title, air_date]
      properties:
        season:
          type: integer
        number:
          type: integer
        title:
          type: string
          nullable: true
        air_date:
          type: string
          nullable: true
          description: YYYY-MM-DD, or null when TMDB has no date yet.
    SeasonEpisode:
      description: >
        One row of the season page's episode list. Nullable fields are always
        present, serialized as null.
      type: object
      required:
        [
          id,
          watched,
          user_rating,
          episode_number,
          title,
          overview,
          air_date,
          runtime_min,
          rating,
          votes,
          still,
          still_full,
          marker,
        ]
      properties:
        id:
          description: >
            Local `episodes.id`, or null when the show has no catalog row yet —
            an episode row is created by tracking, never by a view. A null id is
            not an error: mark the episode by the show's `tmdb_id` plus `season`
            and `episode_number` instead, and tracking mints the id.
          oneOf:
            - type: integer
              format: int64
            - type: "null"
        watched:
          type: boolean
          description: >
            Whether THIS user has ever watched it. False on an untracked show,
            which has no watch rows to find.
        user_rating:
          description: >
            THIS user's rating, 1-10, or null when unrated. An episode is
            rateable; its season is not (D-020).
          oneOf:
            - type: integer
              minimum: 1
              maximum: 10
            - type: "null"
        episode_number:
          type: integer
        title:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
        air_date:
          type: string
          nullable: true
          description: YYYY-MM-DD, or null when TMDB has no date yet.
        runtime_min:
          type: integer
          nullable: true
          description: Minutes; null when TMDB has none.
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score for the episode (0-10); null when unrated.
        votes:
          type: integer
          format: int64
          nullable: true
        still:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied still at grid size — the w300
            variant (api/v1/video/posters/w300/...) — or null when TMDB has
            none. Never a provider URL.
        still_full:
          type: string
          nullable: true
          description: >
            The same still at the episode page's hero size — the w1280 variant
            (api/v1/video/posters/w1280/...). Null exactly when `still` is.
            Stills are 16:9, so the two variants are backdrop sizes.
        marker:
          type: string
          nullable: true
          enum: [season_premiere, mid_season_finale, season_finale, null]
          description: >
            Labels the episodes worth badging, in the up-next cards'
            vocabulary; null for a plain episode. Derived from TMDB's
            episode_type ("finale" / "mid_season") plus the premiere rule
            (episode 1); a finale beats a premiere for a one-episode season.
    EpisodeDetails:
      description: >
        One episode, projected out of its season's stored snapshot. There is
        no id and no tmdb_id for the episode itself in this shape: an episode
        rides its season's snapshot, so it is addressed by its season plus its
        number, and its own id, watched flag and rating travel inside
        `episode`. The season and show context is denormalised in so the page
        renders its header and its way back up without a second call —
        `season_copies` is part of that: an episode is never itself owned, so
        the page displays its SEASON's copies read-only (D-021).
      type: object
      required:
        [
          season_id,
          season_number,
          season_name,
          show_tmdb_id,
          show_title,
          episode,
          cast,
          guest_stars,
          fetched_at,
          season_copies,
          streaming,
          show_dropped, jellyfin_synced]
      properties:
        season_id:
          type: integer
          format: int64
          nullable: true
          description: >
            Local seasons.id of the owning season, null until the show is
            tracked — the same rule as SeasonDetails.id. The episode page links
            back up by (show_tmdb_id, season_number) when it is null.
        season_number:
          type: integer
          description: 0 is Specials.
        season_name:
          type: string
        show_tmdb_id:
          type: integer
          format: int64
          description: TMDB id of the owning show, for the back link.
        show_title:
          type: string
        episode:
          $ref: "#/components/schemas/SeasonEpisode"
        cast:
          type: array
          description: >
            The SEASON's regular cast — TMDB's season `credits`, the same
            people on every episode of the season, which is what TMDB's own
            episode pages list as an episode's cast. Billing order; `episodes`
            is null here (the section carries no counts). Always present.
          items:
            $ref: "#/components/schemas/CastMember"
        guest_stars:
          type: array
          description: >
            Who was credited for THIS episode beyond the regulars — TMDB's
            per-episode guest stars, read out of the season snapshot with no
            extra call. Billing order; `episodes` null. Always present, [] when
            TMDB lists nobody.
          items:
            $ref: "#/components/schemas/CastMember"
        fetched_at:
          type: string
          format: date-time
          description: >
            RFC3339 UTC time of the SEASON snapshot — an episode has no
            snapshot of its own.
        season_copies:
          type: array
          items:
            $ref: "#/components/schemas/CopyKind"
          description: >
            The kinds the requesting user holds a copy of the OWNING SEASON on
            (D-021), kind-ordered — copies are recorded per season, never per
            episode, so this is borrowed for display and is changed from the
            season endpoints. Never null; [] on a live untracked view, which
            carries no user state.
        jellyfin_synced:
          type: boolean
          description: >
            Whether a Jellyfin server is configured (D-033), in which case the
            `jellyfin` entry in `season_copies` is the library scan's answer rather than
            the user's own label, the copy routes refuse that kind, and the
            client renders the tile read-only. Server config on the DTO,
            exactly as `streaming.region` is.
        streaming:
          allOf:
            - $ref: "#/components/schemas/Streaming"
          nullable: true
          description: >
            Where to watch, or null when no listing was available to read — see
            the Streaming schema for why the two empty cases differ.
        show_dropped:
          type: boolean
          description: >
            Whether the requesting user has dropped the show two rungs up
            (D-010), borrowed the same way `streaming` is and read out of the
            same call the season view uses, so the two pages can never disagree
            about it. See SeasonDetails.show_dropped for why it is a boolean and
            not the show's status string; it is NOT ShowDetails.show_status,
            which is TMDB's production status.
    SeasonDetails:
      description: >
        One season, built from its stored snapshot row — or, when the show is
        untracked, from a live TMDB fetch that stored nothing. Like the other
        detail DTOs, `id` is null until the item has a catalog row, and only
        tracking the show creates one (D-015). `copies` and `show_dropped` are
        the two per-user fields so far (D-021, D-010); there are no
        tracked/watched/watchlisted flags —
        season progress is derived state arriving with M2 as additive fields.
        Nullable fields are always present, serialized as null; arrays are
        never null.
      type: object
      required:
        [
          id,
          show_tmdb_id,
          show_title,
          season_number,
          name,
          overview,
          air_date,
          year,
          episode_count,
          rating,
          poster,
          poster_full,
          episodes,
          cast,
          fetched_at,
          copies,
          jellyfin_episodes,
          streaming,
          show_dropped, jellyfin_synced]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: >
            Local `seasons.id`, or null when the season has no catalog row —
            i.e. whenever its show is untracked. Tracking the show writes every
            season at once. There is no tmdb_id for the season itself: TMDB's
            appended season document carries no integer season id, and the
            addressable key is (show `tmdb_id`, `season_number`).
        show_tmdb_id:
          type: integer
          format: int64
          description: TMDB id of the owning show, for the back link.
        show_title:
          type: string
          description: >
            The show's name, denormalised off the show root at fetch time so a
            direct `?id=` visit can render its header without a second call.
        season_number:
          type: integer
          description: TMDB's season number; 0 is Specials.
        name:
          type: string
        overview:
          type: string
          nullable: true
        air_date:
          type: string
          nullable: true
          description: YYYY-MM-DD of the season premiere, or null when undated.
        year:
          type: string
          nullable: true
          description: Premiere year ("2008"), derived from `air_date`.
        episode_count:
          type: integer
          description: Episodes TMDB lists for the season, aired or not.
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score for the season (0-10); null when unrated.
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied thumb
            (api/v1/video/posters/w185/...), or null when the season has no
            poster of its own. Never a provider URL.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the detail size
            (api/v1/video/posters/w500/...); null exactly when `poster` is.
        episodes:
          type: array
          description: >
            Every episode TMDB lists for the season, in episode order.
            Uncapped — a season's episode list is the page's content.
          items:
            $ref: "#/components/schemas/SeasonEpisode"
        cast:
          type: array
          description: >
            This season's aggregate credits — everyone credited in its
            episodes, ordered by billing, each `episodes` count taken WITHIN
            the season. Always present; [] when TMDB lists nobody or the
            snapshot predates the section. Photos are the show's cast photos,
            served from the show's asset tree once downloaded.
          items:
            $ref: "#/components/schemas/CastMember"
        fetched_at:
          type: string
          format: date-time
          description: When the snapshot was (re)fetched. RFC3339 UTC.
        copies:
          type: array
          items:
            $ref: "#/components/schemas/CopyKind"
          description: >
            The kinds the requesting user holds a copy of this season on
            (D-021), kind-ordered. Never null; [] on a live untracked view,
            which carries no user state.
        jellyfin_synced:
          type: boolean
          description: >
            Whether a Jellyfin server is configured (D-033), in which case the
            `jellyfin` entry in `copies` is the library scan's answer rather than
            the user's own label, the copy routes refuse that kind, and the
            client renders the tile read-only. Server config on the DTO,
            exactly as `streaming.region` is.
        jellyfin_episodes:
          type: integer
          nullable: true
          description: >
            How many of this season's episode files the Jellyfin library scan
            found (D-033). Null when no server is configured or the season is
            not on it. A client compares it with the season's AIRED episodes
            to tell a complete season from a partial one — the tile turns
            amber when some are missing.
        streaming:
          allOf:
            - $ref: "#/components/schemas/Streaming"
          nullable: true
          description: >
            Where to watch, or null when no listing was available to read — see
            the Streaming schema for why the two empty cases differ.
        show_dropped:
          type: boolean
          description: >
            Whether the requesting user has dropped the OWNING SHOW (D-010) —
            borrowed from the show exactly as `streaming` is, and per-user
            exactly as `copies` is, so the page can say "you gave up on this"
            instead of silently offering the controls of a show still in
            progress. A boolean rather than the show's status string on purpose:
            a season-shaped view reports no show status and no show progress —
            that is the show page's job — and `dropped` is the one state that
            changes how this page should read. It is NOT
            ShowDetails.show_status, which is TMDB's production status. False on
            a live untracked view, since no state row exists to be dropped in;
            sticky (D-010), so no write from this page can stale it.
    ShowDetails:
      description: >
        One show — from the stored catalog snapshot, or, for an untracked
        `tmdb_id` view, built live from TMDB without storing anything (D-015).
        A tracked snapshot older than two days refreshes on view and falls back
        to the stale data when TMDB is down; only an untracked view can 503. It
        mirrors MovieDetails wherever the concepts match — so the SPA renders
        both detail pages through the same components — and diverges where TV
        does: seasons and episode counts instead of one runtime, `created_by`
        instead of a director, `networks` instead of budget and revenue.
        CastMember, MovieVideo and MovieImage are reused as-is; a show's
        credits and artwork carry exactly the movie shapes. Nullable fields are
        always present, serialized as null; arrays are never null. Image URLs
        come in two relative families, interchangeable to clients: the lazy
        cache proxy (`api/v1/video/posters/…`,
        `api/v1/video/youtube-thumbs/…`) and, for a tracked show's artwork
        already downloaded, permanent storage
        (`api/v1/video/shows/{id}/assets/…`). Never a provider URL.
      type: object
      required:
        [
          id,
          tmdb_id,
          title,
          original_title,
          first_air_date,
          last_air_date,
          year,
          end_year,
          episode_runtime_min,
          seasons_count,
          episodes_count,
          show_status,
          in_production,
          overview,
          tagline,
          genres,
          created_by,
          networks,
          next_episode,
          rating,
          votes,
          cast,
          seasons,
          videos,
          backdrops,
          posters,
          poster,
          poster_full,
          backdrop,
          backdrop_full,
          homepage,
          imdb_id,
          trailer_url,
          original_language,
          popularity,
          fetched_at,
          tracked,
          watched,
          watchlisted,
          status,
          user_rating,
          user_episode_rating,
          user_rated_episodes,
          progress,
          streaming,
          similar,
          jellyfin_synced,
        ]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: >
            Local catalog id (`shows.id`), or null when the show has no catalog
            row — an untracked view served live. Tracking creates the row; a
            client holding null adopts the TrackResult's `target_id`.
        tmdb_id:
          type: integer
          format: int64
        title:
          type: string
          description: >
            TMDB's `name`. The field keeps the movie name because the SPA
            renders both detail pages through the same components.
        original_title:
          type: string
          nullable: true
          description: TMDB's `original_name`.
        first_air_date:
          type: string
          nullable: true
          description: YYYY-MM-DD, or null when TMDB has no date.
        last_air_date:
          type: string
          nullable: true
          description: >
            YYYY-MM-DD of the most recently aired episode. A returning series
            has one; it is not an end date.
        year:
          type: string
          nullable: true
          description: Premiere year ("2008"), derived from `first_air_date`.
        end_year:
          type: string
          nullable: true
          description: >
            Final year, derived from `last_air_date` and set only for a show
            that is no longer in production. Null for a returning series.
        episode_runtime_min:
          type: integer
          nullable: true
          description: >
            Typical episode length. TMDB reports an array (a show can change
            format); this is its first entry, and null when TMDB has none.
        seasons_count:
          type: integer
        episodes_count:
          type: integer
        show_status:
          type: string
          nullable: true
          description: >
            TMDB's production status ("Returning Series", "Ended",
            "Canceled"). NOT the user's watch status — M2's user_show_states
            carries watching/watched/dropped, a different axis that happens to
            share the word.
        in_production:
          type: boolean
        overview:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        created_by:
          type: array
          description: Creator names — the show analogue of a movie's `director`.
          items:
            type: string
        networks:
          type: array
          description: Network names — the show analogue of the budget/revenue facts.
          items:
            type: string
        next_episode:
          allOf:
            - $ref: "#/components/schemas/ShowEpisodeStub"
          nullable: true
          description: >
            TMDB's next episode to air, or null when it knows of none. Read
            live like everything else here — this is not the M2 up-next
            derivation, which comes from the user's own watch history.
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score (0-10), not a user rating; null when TMDB
            reports the show as unrated.
        votes:
          type: integer
          format: int64
          nullable: true
          description: TMDB vote count behind `rating`; null when none.
        cast:
          type: array
          description: >
            Full credited cast, ordered by billing. From TMDB's
            `aggregate_credits` — everyone credited across every episode, each
            with an `episodes` count — not the latest-season `credits`, which
            lists only the current series regulars. Uncapped: how many to show
            is presentation, so the client owns it.
          items:
            $ref: "#/components/schemas/CastMember"
        seasons:
          type: array
          description: >
            Every season TMDB lists, ordered ascending with Specials (season 0)
            last. Uncapped: how many to show at once is presentation, so the
            client owns it.
          items:
            $ref: "#/components/schemas/ShowSeason"
        videos:
          type: array
          description: >
            The media section's Videos tab — every YouTube video TMDB lists,
            ordered the same way `trailer_url` is chosen, so the first entry is
            the video `trailer_url` points at. Capped at 30.
          items:
            $ref: "#/components/schemas/MovieVideo"
        backdrops:
          type: array
          description: >
            The media section's Backdrops tab (16:9), best-rated first. Capped
            at 30.
          items:
            $ref: "#/components/schemas/MovieImage"
        posters:
          type: array
          description: >
            The media section's Posters tab (2:3), best-rated first. Capped at
            30. Alternative artwork; the show's own poster is the
            `poster`/`poster_full` pair.
          items:
            $ref: "#/components/schemas/MovieImage"
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied thumb
            (api/v1/video/posters/w185/...), or null when TMDB has no poster.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the detail-page size
            (api/v1/video/posters/w500/...); null exactly when `poster` is.
        backdrop:
          type: string
          nullable: true
          description: >
            Relative URL of the hero backdrop thumb
            (api/v1/video/posters/w300/...), or null when TMDB has no backdrop.
            Downloaded for every tracked show, so a tracked show's hero renders
            from disk. Never a provider URL.
        backdrop_full:
          type: string
          nullable: true
          description: >
            The same backdrop at the hero size
            (api/v1/video/posters/w1280/...); null exactly when `backdrop` is.
        homepage:
          type: string
          nullable: true
          description: The show's official site, or null when TMDB has none.
        imdb_id:
          type: string
          nullable: true
          description: >
            IMDb title id ("tt0903747") from TMDB's external ids; clients build
            the IMDb URL from it. Null when TMDB has none.
        trailer_url:
          type: string
          nullable: true
          description: >
            YouTube watch URL of the best video TMDB lists: a trailer beats a
            teaser, official beats unofficial, then the newest wins. Null when
            no YouTube trailer or teaser exists.
        original_language:
          type: string
          nullable: true
          description: ISO 639-1 code of the original language ("en").
        popularity:
          type: number
          nullable: true
          description: >
            TMDB's relative trending metric (no fixed scale), as of
            `fetched_at`.
        fetched_at:
          type: string
          description: >
            When the snapshot was fetched from TMDB (RFC3339 UTC) — the
            snapshot's own instant for a tracked show, the current instant for a
            live untracked view. Snapshots older than 2 days refresh on view.
        tracked:
          type: boolean
          description: >
            Whether ANY user references this show — a state row, a watchlist
            row, a favorite, an episode watch, a rating or an owned copy on
            the show, a season or an episode. False on a live untracked view.
        watched:
          type: boolean
          description: >
            Whether the requesting user's stored status has reached `watched` —
            every aired, non-special episode (D-012).
        watchlisted:
          type: boolean
          description: >
            Whether the requesting user has this show watchlisted. An
            independent axis, never a status (D-011): orthogonal to both
            `status` and `watched`.
        favorited:
          type: boolean
          description: >
            Whether the requesting user has this show among their favorites —
            the third independent axis (D-030), orthogonal to `status`,
            `watched` and `watchlisted` alike. False on a live untracked view.
        jellyfin_synced:
          type: boolean
          description: >
            Whether a Jellyfin server is configured (D-033), in which case
            every season's `jellyfin` copy is the library scan's answer rather
            than the user's own label, the copy routes refuse that kind, and
            the show page renders the tile read-only.
        status:
          type: string
          enum: [watching, watched, dropped]
          nullable: true
          description: >
            The requesting user's system-maintained WATCH status, or null when
            they do not track this show. Distinct from `show_status`, which is
            TMDB's production status. Written only by the status recompute
            (D-010); `dropped` is the one user-set value and is sticky.
        user_rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
          description: >
            The requesting user's own rating (1-10), or null when they have not
            rated it. Not a provider score — `rating` is TMDB's community
            float. Null on a live untracked view, which carries no user state.
        user_episode_rating:
          type: number
          format: double
          nullable: true
          description: >
            The mean of the requesting user's EPISODE ratings across the whole
            show (1–10, fractional), or null when none is rated or the show is
            untracked. The companion read to `user_rating`, computed
            server-side so it is weighted per episode — a mean of the seasons'
            `user_rating` means would weight seasons equally instead.
        user_rated_episodes:
          type: integer
          description: >
            How many episode ratings went into `user_episode_rating`; 0 whenever
            that is null.
        progress:
          allOf:
            - $ref: "#/components/schemas/ShowProgress"
          nullable: true
          description: >
            Derived progress for the requesting user, or null when the show is
            untracked. Recomputed per request, never stored (D-010).
        streaming:
          allOf:
            - $ref: "#/components/schemas/Streaming"
          nullable: true
          description: >
            Where to watch, or null when no listing was available to read — see
            the Streaming schema for why the two empty cases differ.
        similar:
          type: array
          items:
            $ref: "#/components/schemas/SimilarTitle"
          description: >
            TMDB's recommendations for this show — the "Similar shows" rail
            (D-024) — in TMDB's relevance order, at most 20. Read off the same
            snapshot as the cast, so it renders with TMDB unreachable and is
            only as current as `fetched_at`. Never null: [] both when the
            snapshot has no section yet and when TMDB lists nobody. Seasons
            and episodes carry no such list — TMDB publishes recommendations
            per show only.

    TrackRequest:
      description: >
        The polymorphic tracking body. Exactly one of `tmdb_id` and
        `target_id` must be set — the pair (`target_type`, id) identifies the
        target, and the ids are different namespaces per type. `tmdb_id` is how
        a live details view, which has no local id yet, tracks what it is
        looking at.


        For a `show` or an `episode`, `tmdb_id` is the **show's** id: an episode
        has no TMDB id of its own here, because episodes ride their season's
        document rather than being addressed directly. An episode addressed by
        `tmdb_id` therefore also needs `season` and `episode`, and resolving it
        materialises the whole show — every season and every episode — if it is
        not already tracked.
      type: object
      required: [target_type]
      properties:
        target_type:
          type: string
          enum: [movie, show, episode]
          description: >
            Which operation accepts which type differs: watches take `movie`
            and `episode` (a whole show is `/video/watches/bulk`), ratings take
            `movie`, `show` and `episode` but never `season` (D-020), and the
            watchlist and the favorites take `movie` and `show`.
        tmdb_id:
          type: integer
          format: int64
          description: >
            TMDB id — the movie's for a movie target, the SHOW's for a show or
            episode target. Materialises the catalog rows on a miss.
        target_id:
          type: integer
          format: int64
          description: >
            Local catalog id in the target's own table (`movies.id`,
            `shows.id`, `episodes.id`). Never a provider call; a miss is a 404.
        season:
          type: integer
          description: >
            Season number; episode targets addressed by `tmdb_id` only. 0 is
            Specials. Sending it with any other target type is a 422 —
            `BulkWatchRequest`'s season targets carry their own copy of this
            field with season rules.
        episode:
          type: integer
          description: >
            Episode number; required alongside `season`. 0 is valid — some
            shows number a pilot or recap 0.
    WatchRequest:
      description: >
        A watch. The target-identification rules are `TrackRequest`'s,
        restated here so widening this body cannot widen the watchlist's — the
        two endpoints share the rules, not the schema.


        `watched_at` is what switches the endpoint from the idempotent
        first-watch mark to an explicit log that always inserts (D-009).
      type: object
      required: [target_type]
      properties:
        target_type:
          type: string
          enum: [movie, episode]
          description: >
            A whole show is `/video/watches/bulk`, whose answer is a count
            rather than this endpoint's boolean, so `show` is a 422 here.
        tmdb_id:
          type: integer
          format: int64
          description: >
            TMDB id — the movie's for a movie target, the SHOW's for an
            episode. Materialises the catalog rows on a miss.
        target_id:
          type: integer
          format: int64
          description: Local `movies.id` or `episodes.id`.
        season:
          type: integer
          description: Season number; episode targets addressed by `tmdb_id` only.
        episode:
          type: integer
          description: Episode number; required alongside `season`.
        watched_at:
          type: string
          format: date-time
          description: >
            The instant the watch happened, RFC3339. Omit it for the
            idempotent first-watch mark (what a season grid's tick and an
            optimistic retry want). Send it to log one viewing deliberately:
            the row is always written, even on a target already watched, which
            is how a rewatch is recorded.


            Any offset is accepted and normalised to UTC before storage, so
            the stored value is always one offsetless instant. There is no
            lower bound — a watch can predate the library — but a value after
            the server's current time is a **422**.
        rating:
          type: integer
          minimum: 1
          maximum: 10
          description: >
            Optional; upserted in the same transaction as the watch row,
            exactly as `PUT /video/ratings` would. Omitting it leaves any
            existing rating untouched — this is never a clear, which stays
            `DELETE /video/ratings/{target_type}/{target_id}`. Its `updated_at`
            is the real current time even when the watch is backdated: a rating
            is the current opinion, not an event.
    CopyKind:
      description: >
        One copy format/service (D-021). `physical` and `digital` cover copies
        with no branded format — a disc-less physical medium, or a bare file.
      type: string
      enum: [jellyfin, dvd, bluray, uhd, physical, digital]
    CopyRequest:
      description: >
        An owned copy. The target-identification rules are `TrackRequest`'s,
        restated here so widening this body cannot widen another endpoint's —
        the endpoints share the rules, not the schema.


        Copies are stored per movie and PER-SEASON (D-021): `show` is accepted
        as a bulk fan-out scope — one row per non-special season — but is never
        itself a stored target, and `episode` is refused. A `season` target is
        addressed by its local `target_id`, or by the SHOW's `tmdb_id` plus
        `season` — a season has no TMDB id of its own.
      type: object
      required: [target_type, kind]
      properties:
        target_type:
          type: string
          enum: [movie, season, show]
        tmdb_id:
          type: integer
          format: int64
          description: >
            TMDB id — the movie's for a movie target, the SHOW's for a season
            or show target. Materialises the catalog rows on a miss: for a
            season or show, the WHOLE show.
        target_id:
          type: integer
          format: int64
          description: >
            Local catalog id in the target's own table (`movies.id`,
            `seasons.id`, `shows.id`). Never a provider call; a miss is a 404.
        season:
          type: integer
          description: >
            Season number; season targets addressed by `tmdb_id` only. 0 is
            Specials, which IS addressable here — only the show-level fan-out
            skips it. Sending it with any other target type is a 422.
        kind:
          $ref: "#/components/schemas/CopyKind"
    CopyResult:
      description: What a copies write did.
      type: object
      required: [target_type, target_id, kind, created]
      properties:
        target_type:
          type: string
          enum: [movie, season, show]
        target_id:
          type: integer
          format: int64
          description: >
            Local catalog id of the target — for a target tracked from a live
            view, the id its freshly materialised row received. For a `show`
            scope, the show's id (the rows themselves land on its seasons).
        kind:
          $ref: "#/components/schemas/CopyKind"
        created:
          type: integer
          format: int64
          description: >
            Copy rows actually written — a COUNT, not TrackResult's boolean,
            because the show scope fans out: 0 or 1 for a movie or season
            target, 0..N seasons for a show. 0 means every addressed target
            already carried the kind.
    TrackResult:
      description: What a tracking call did.
      type: object
      required: [created, target_type, target_id, show]
      properties:
        created:
          type: boolean
          description: False when the call was an idempotent no-op.
        target_type:
          type: string
          enum: [movie, show, episode]
        target_id:
          type: integer
          format: int64
          description: >
            Local catalog id of the target — for a target tracked from a live
            view, the id its freshly materialised row received.
        show:
          description: >
            The owning show's recomputed state, for an episode target. Always
            null for a movie. Marking one episode changes both the show's status
            and its derived progress, and nothing else in this response would
            say so.
          oneOf:
            - $ref: "#/components/schemas/TrackShow"
            - type: "null"
    DropResult:
      description: >
        What a drop or un-drop did. `changed` is false when the stored status
        was already what the call asked for, so a repeat is honest about having
        done nothing.
      type: object
      required: [changed, show]
      properties:
        changed:
          type: boolean
          description: Whether the stored status actually moved.
        show:
          description: >
            The show's status and derived progress AFTER the write. It travels
            back because an un-drop recomputes, and whether that lands on
            `watched`, `watching` or no row at all is the server's to state.
          allOf:
            - $ref: "#/components/schemas/TrackShow"
    TrackShow:
      description: One show's status and derived progress after a tracking call.
      type: object
      required: [id, status, progress]
      properties:
        id:
          type: integer
          format: int64
          description: Local `shows.id`.
        status:
          description: >
            The system-maintained watch status (D-010), or null when the show
            has no state row. `dropped` is the only user-set value and is
            sticky; a recompute never produces or destroys it.
          oneOf:
            - type: string
              enum: [watching, watched, dropped]
            - type: "null"
        progress:
          $ref: "#/components/schemas/ShowProgress"
    ShowProgress:
      description: >
        A show's DERIVED progress — never stored (D-010), recomputed from
        `episodes` + `user_watch_history` on every read. All three figures count
        non-special episodes only (D-012), and they count episodes rather than
        watch rows, so a rewatch can never push `watched` past `total`.
      type: object
      required: [watched, aired_total, total]
      properties:
        watched:
          type: integer
          description: Aired, non-special episodes this user has watched.
        aired_total:
          type: integer
          description: >
            Aired, non-special episodes. `watched == aired_total > 0` is exactly
            the condition under which the status is `watched`.
        total:
          type: integer
          description: >
            Non-special episodes, aired or not. Shown secondary to
            watched/aired, because `8/10` next to a status of *watched* would
            otherwise read as a bug.
    SeasonProgress:
      description: >
        One season's DERIVED progress — `ShowProgress` narrowed to a season,
        computed the same way (episodes counted through an EXISTS on the log,
        so a rewatch never pushes `watched` past `total`). Unlike the show's,
        season 0 counts the specials themselves: this is display, not D-012's
        completion rule, and a season has no status for it to gate.
      type: object
      required: [watched, aired_total, total]
      properties:
        watched:
          type: integer
          description: Aired episodes of this season the user has watched.
        aired_total:
          type: integer
          description: Aired episodes of this season.
        total:
          type: integer
          description: Episodes of this season, aired or not.
    BulkWatchRequest:
      description: >
        A bulk mark. `scope` says what to mark; the target-identification rules
        are `TrackRequest`'s, embedded, so they cannot drift.
      type: object
      required: [scope, target_type]
      properties:
        scope:
          type: string
          enum: [show, season]
          description: >
            `show` marks every aired, non-special episode of the show; `season`
            those of one season. A field rather than a separate route so a
            further scope could land additively. The scope names the target's
            type, so a mismatched pair is a 422.
        target_type:
          type: string
          enum: [show, season]
        tmdb_id:
          type: integer
          format: int64
          description: >
            The SHOW's TMDB id for both scopes; materialises the whole show on
            a miss. A season target needs `season` alongside it.
        target_id:
          type: integer
          format: int64
          description: >
            Local `shows.id` or `seasons.id`, by target_type. Like every other
            target_id path this never calls TMDB: a season row only ever exists
            beneath a tracked show (D-015), so its owning show and episodes are
            already local. The season page uses the `tmdb_id` + `season` form
            while the show is untracked.
        season:
          type: integer
          description: >
            Season number, required when a season target is addressed by
            `tmdb_id` and rejected alongside `target_id`. 0 — Specials — is
            addressable but the mark refuses it with a 422.
        rewatch:
          type: boolean
          default: false
          description: >
            False skips episodes this user has already watched — the idempotent
            default. True inserts a new row for EVERY eligible episode: a full
            deliberate rewatch, not idempotent, guarded by the client rather
            than the server. An independent axis from `watched_at_mode`.
        watched_at_mode:
          type: string
          enum: [now, fixed, episode_air, season_air]
          default: now
          description: >
            Where each row's `watched_at` comes from. `now`/`fixed` share one
            instant; `episode_air` takes each episode's own air date and
            `season_air` its season's premiere, both as midnight in the user's
            time zone (D-038), stored in UTC. An unknown value is a 422.
        watched_at:
          type: string
          format: date-time
          description: >
            RFC3339. Required with mode `fixed` (the shared instant); optional
            with `season_air`, where it dates the episodes whose season has no
            usable premiere — and required if any exist. Rejected with `now`
            and `episode_air`. Same rules as the single log's field: normalised
            to UTC, a future instant is a 422, no lower bound.
    BulkWatchResult:
      description: >
        What a bulk mark did. Deliberately not a `TrackResult`: that reports a
        boolean `created`, and a bulk mark's honest answer is a count. `status`
        and `progress` are always the OWNING SHOW's, whatever the scope — a
        season has no status of its own, and marking one season can complete
        the show.
      type: object
      required: [target_type, target_id, created, status, progress]
      properties:
        target_type:
          type: string
          enum: [show, season]
        target_id:
          type: integer
          format: int64
          description: Local `shows.id` or `seasons.id`, matching target_type.
        created:
          type: integer
          format: int64
          description: >
            Watch rows actually written. 0 on a repeat of the default mode —
            without `rewatch` the mark is idempotent set-wise, so a double tap
            writes nothing rather than a few hundred duplicate rewatches. With
            `rewatch: true` every call writes the full eligible count.
        status:
          oneOf:
            - type: string
              enum: [watching, watched, dropped]
            - type: "null"
        progress:
          $ref: "#/components/schemas/ShowProgress"
    RateRequest:
      description: >
        A rating plus the same target-identification rules as `TrackRequest`:
        exactly one of `tmdb_id` and `target_id`, which are different id
        namespaces. `tmdb_id` is how a live details view, which has no local id
        yet, rates what it is looking at.


        Movies, shows and episodes are rateable. A **season is not** (D-020) —
        `user_video_ratings` still carries the target type so the schema need
        not change if that reverses, but every write path refuses one with a
        422.
      type: object
      required: [target_type, rating]
      properties:
        target_type:
          type: string
          enum: [movie, show, episode]
          description: >
            `season` is refused with a 422 (D-020). An episode addressed by
            `tmdb_id` also needs `season` and `episode`, exactly as in
            `TrackRequest`.
        tmdb_id:
          type: integer
          format: int64
          description: >
            TMDB id — the movie's, or the SHOW's for a show or episode target.
            Materialises the catalog rows on a miss, because a rating is a
            reference (D-008).
        target_id:
          type: integer
          format: int64
          description: Local catalog id in the target's own table.
        season:
          type: integer
          description: Season number; episode targets addressed by `tmdb_id` only.
        episode:
          type: integer
          description: Episode number; required alongside `season`.
        rating:
          type: integer
          minimum: 1
          maximum: 10
          description: >
            The rating, an integer 1-10 on the scale every component shares.
            Required — omitting it is a 422, not a zero. To take a rating back,
            DELETE it rather than sending a low value.
    RatingResult:
      description: >
        The rating now stored. There is deliberately no `created` flag: a
        re-rating overwrites, so whether a rating existed before is not a
        distinction a client can act on.
      type: object
      required: [target_type, target_id, rating]
      properties:
        target_type:
          type: string
          enum: [movie, show, episode]
        target_id:
          type: integer
          format: int64
          description: >
            Local catalog id of the target in its own table — for a target rated
            from a live view, the id its freshly materialised row received.
        rating:
          type: integer
          minimum: 1
          maximum: 10
    TMDBLinkStatus:
      description: >
        The state of this user's TMDB account link (D-029). Nullable fields are
        null, not absent, when unlinked.
      type: object
      required: [configured, linked, broken, username, linked_at, pending, setup_done, sync, pull]
      properties:
        configured:
          type: boolean
          description: >
            Whether the server holds a TMDB credential at all. False means
            linking cannot work, and the client hides the action.
        linked:
          type: boolean
        broken:
          type: boolean
          description: >
            TMDB refused the stored session. The link row is kept so the
            account can be named, but no new rating changes are queued until
            the user links again.
        username:
          type: string
          nullable: true
          description: The TMDB account's username, read once at link time.
        linked_at:
          type: string
          format: date-time
          nullable: true
        pending:
          type: integer
          description: Changes (ratings, watchlist and favorites) still waiting to be sent to TMDB.
        setup_done:
          type: boolean
          description: >
            Whether the one-time setup after linking has finished (D-036).
            False while linked means the client shows the setup step.
        sync:
          $ref: "#/components/schemas/TMDBSyncKinds"
        pull:
          description: >
            The setup's pull job for THIS link — running, or the last one's
            report — and null when none has run since the server started
            (a restart forgets the job; the committed items stay).
          oneOf:
            - $ref: "#/components/schemas/TMDBPullJob"
            - type: "null"
    TMDBSyncKinds:
      description: >
        The three ongoing-sync switches (D-036): whether a local write of
        that kind queues a push to the linked account. All false when
        unlinked and until the setup.
      type: object
      required: [ratings, watchlist, favorites]
      properties:
        ratings:
          type: boolean
        watchlist:
          type: boolean
        favorites:
          type: boolean
    TMDBSetupSection:
      description: One kind's setup choice — the one-time action and the ongoing switch.
      type: object
      required: [action, sync]
      properties:
        action:
          type: string
          enum: [pull, push, skip]
        sync:
          type: boolean
    TMDBSetupRequest:
      type: object
      required: [ratings, watchlist, favorites]
      properties:
        ratings:
          $ref: "#/components/schemas/TMDBSetupSection"
        watchlist:
          $ref: "#/components/schemas/TMDBSetupSection"
        favorites:
          $ref: "#/components/schemas/TMDBSetupSection"
    TMDBPullJob:
      description: >
        One user's setup pull (D-036): its state, where it is, and what it
        has done. `report` counts what has landed so far while `running` and
        is final once `done` or `failed`. `error` is set only when `failed`;
        the items written before that stay written, and running the setup
        again converges.
      type: object
      required: [state, started_at, finished_at, progress, report, error]
      properties:
        state:
          type: string
          enum: [running, done, failed]
        started_at:
          type: string
          description: RFC3339 UTC.
        finished_at:
          type: [string, "null"]
          description: RFC3339 UTC; null while running.
        progress:
          $ref: "#/components/schemas/TMDBPullProgress"
        report:
          $ref: "#/components/schemas/TMDBPullReport"
        error:
          oneOf:
            - $ref: "#/components/schemas/TMDBPullError"
            - type: "null"
    TMDBPullProgress:
      type: object
      required: [section, list, page, total_pages, items_done]
      properties:
        section:
          type: string
          description: "`ratings`, `watchlist` or `favorites`; empty once finished."
        list:
          type: string
          description: "`movies`, `shows` or `episodes` — the list being read."
        page:
          type: integer
        total_pages:
          type: integer
          description: 0 until the first page of the current list answers.
        items_done:
          type: integer
          description: Entries handled so far, across every list.
    TMDBPullReport:
      type: object
      required:
        [ratings_imported, episode_ratings_imported, watchlist_added, favorites_added,
         movies_materialised, shows_materialised, skipped_total, skipped_by_reason]
      properties:
        ratings_imported:
          type: integer
          description: Movie and show ratings written (overwriting a local one counts).
        episode_ratings_imported:
          type: integer
        watchlist_added:
          type: integer
          description: Entries inserted; one already held counts for nothing.
        favorites_added:
          type: integer
        movies_materialised:
          type: integer
          description: Movies the library had never seen, tracked through the pull.
        shows_materialised:
          type: integer
        skipped_total:
          type: integer
        skipped_by_reason:
          type: object
          additionalProperties:
            type: integer
          description: >
            Counts per reason code, the restore's codes: `movie_not_found`,
            `show_not_found`, `movie_unavailable`, `show_unavailable`,
            `provider_unavailable` (the breaker tripped), `episode_not_found`.
    TMDBPullError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [cancelled, session_invalid, provider_unavailable, internal]
        message:
          type: string
    JellyfinScanReport:
      description: >
        One Jellyfin library scan's outcome (D-033). The `jellyfin_*` counts
        are what the server holds before matching; the `matched_*` counts are
        what found a catalog row and was written. On an error nothing was
        written and the previous scan's answer stands.
      type: object
      required:
        [
          started_at,
          finished_at,
          jellyfin_movies,
          jellyfin_series,
          jellyfin_episodes,
          matched_movies,
          matched_seasons,
          error,
        ]
      properties:
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        jellyfin_movies:
          type: integer
          description: Movies on the server that carry a TMDB id.
        jellyfin_series:
          type: integer
          description: Series on the server that carry a TMDB id.
        jellyfin_episodes:
          type: integer
          description: Episode FILES on the server with a season number (placeholders excluded).
        matched_movies:
          type: integer
        matched_seasons:
          type: integer
          description: Catalog seasons with at least one episode file on the server.
        error:
          type: string
          nullable: true
          enum: [auth_failed, provider_unavailable, internal]
          description: >
            Null on success. `auth_failed` — the server refused the API key;
            `provider_unavailable` — it could not be reached or answered
            badly; `internal` — a bug, logged server-side.
    JellyfinStatus:
      description: >
        The Jellyfin library scan's state (D-033). In server memory only, so a
        restart forgets the last report.
      type: object
      required: [configured, server_name, scanning, interval_seconds, last]
      properties:
        configured:
          type: boolean
          description: >
            Whether `JELLYFIN_URL` and `JELLYFIN_API_KEY` are set. False means
            the `jellyfin` copy kind is a hand-set label as before and the
            scan route is a 404.
        server_name:
          type: string
          nullable: true
          description: What the server reported on the last successful ping; null until one.
        scanning:
          type: boolean
        interval_seconds:
          type: integer
          format: int64
          description: The scheduled cadence; 0 means only "scan now" runs it.
        last:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/JellyfinScanReport"
    TicketBoxDump:
      description: >
        A Ticket Box backup file, field names exactly as Ticket Box writes them
        (camelCase — the one place this API is not snake_case, because the file
        is not sofalog's to rename). The four arrays may be absent. Every
        timestamp is an RFC3339 instant; Ticket Box writes UTC with
        milliseconds and a `Z`.
      type: object
      additionalProperties: false
      required: [schemaVersion]
      properties:
        schemaVersion:
          type: integer
          description: Must be 5. Any other value is a 422 naming it.
        exportedAt:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/TicketBoxHistoryEntry"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/TicketBoxRatingEntry"
        watchlist:
          type: array
          items:
            $ref: "#/components/schemas/TicketBoxWatchlistEntry"
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/TicketBoxFavoriteEntry"
    TicketBoxHistoryEntry:
      description: >
        One viewing. A movie carries its own `tmdbId`; an episode carries the
        SHOW's id as `showTmdbId` plus `season` and `episode`, and its own
        `tmdbId` when Ticket Box knew it. The episode is found by that id
        first, through the show's stored season documents, and by position
        only when the id is null or unknown — TMDB renumbers, the file's
        positions are what Ticket Box cached. `imdbId` is accepted and ignored.
      type: object
      additionalProperties: false
      required: [type, addedAt, historyType]
      properties:
        type:
          type: string
          enum: [movie, episode]
        tmdbId:
          type: [integer, "null"]
          format: int64
        imdbId:
          type: [string, "null"]
          description: Informational; accepted and ignored.
        showTmdbId:
          type: [integer, "null"]
          format: int64
        season:
          type: [integer, "null"]
        episode:
          type: [integer, "null"]
        addedAt:
          type: string
          description: When the viewing happened. Becomes `watched_at`.
        historyType:
          type: string
          enum: [watch, checkin, scrobble]
          description: Ticket Box's provenance label; stored as `watch_type` verbatim.
    TicketBoxRatingEntry:
      description: >
        One rating. Movies and shows carry their own `tmdbId`; seasons and
        episodes carry `showTmdbId` + `season` (+ `episode`), and an episode
        is resolved id-first exactly as a history entry is. A **season**
        rating is skipped and reported (D-020), never written.
      type: object
      additionalProperties: false
      required: [type, rating, ratedAt]
      properties:
        type:
          type: string
          enum: [movie, show, season, episode]
        tmdbId:
          type: [integer, "null"]
          format: int64
        imdbId:
          type: [string, "null"]
          description: Informational; accepted and ignored.
        showTmdbId:
          type: [integer, "null"]
          format: int64
        season:
          type: [integer, "null"]
        episode:
          type: [integer, "null"]
        rating:
          type: integer
          minimum: 1
          maximum: 10
        ratedAt:
          type: string
          description: Becomes the rating's `updated_at`.
    TicketBoxWatchlistEntry:
      description: >
        One watchlist row. Only `movie` and `show` are taken; a `season` or
        `episode` entry is skipped and reported, because sofalog watchlists
        neither.
      type: object
      additionalProperties: false
      required: [type, listedAt]
      properties:
        type:
          type: string
          enum: [movie, show, season, episode]
        tmdbId:
          type: [integer, "null"]
          format: int64
        imdbId:
          type: [string, "null"]
          description: Informational; accepted and ignored.
        showTmdbId:
          type: [integer, "null"]
          format: int64
        season:
          type: [integer, "null"]
        episode:
          type: [integer, "null"]
        listedAt:
          type: string
          description: Becomes the watchlist row's `added_at` when the row is new.
    TicketBoxFavoriteEntry:
      description: >
        One favorite. Movies and shows only, each by its own `tmdbId`; any
        other type is skipped and reported as `unknown_type`.
      type: object
      additionalProperties: false
      required: [type, favoritedAt]
      properties:
        type:
          type: string
          enum: [movie, show]
        tmdbId:
          type: [integer, "null"]
          format: int64
        imdbId:
          type: [string, "null"]
          description: Informational; accepted and ignored.
        favoritedAt:
          type: string
          description: Becomes the favorite row's `added_at` when the row is new.
    RestoreJob:
      description: >
        One user's restore: its state, how far along it is, and what it has
        done. `report` counts what has landed so far while `running` and is
        final once `done` or `failed`. `error` is set only when `failed` —
        `cancelled` when the server shut down mid-run, `internal` otherwise;
        the groups committed before that stay committed.
      type: object
      required: [kind, state, started_at, finished_at, progress, report, error]
      properties:
        kind:
          type: string
          enum: [ticket_box]
        state:
          type: string
          enum: [running, done, failed]
        started_at:
          type: string
          description: RFC3339 UTC.
        finished_at:
          type: [string, "null"]
          description: RFC3339 UTC; null while running.
        progress:
          $ref: "#/components/schemas/RestoreProgress"
        report:
          $ref: "#/components/schemas/RestoreReport"
        error:
          oneOf:
            - $ref: "#/components/schemas/RestoreError"
            - type: "null"
    RestoreProgress:
      description: >
        A group is one movie or one show — the unit of work and of the
        transaction. `groups_total` is known from validation, before the job
        starts.
      type: object
      required: [groups_total, groups_done, current]
      properties:
        groups_total:
          type: integer
        groups_done:
          type: integer
        current:
          oneOf:
            - $ref: "#/components/schemas/RestoreCurrent"
            - type: "null"
    RestoreCurrent:
      description: >
        The group being worked on. `title` is null until the item's catalog
        row is in hand — while an untracked show is being fetched.
      type: object
      required: [type, tmdb_id, title]
      properties:
        type:
          type: string
          enum: [movie, show]
        tmdb_id:
          type: integer
          format: int64
        title:
          type: [string, "null"]
    RestoreReport:
      description: >
        What the import did. `history_replaced` is the number of this user's
        pre-existing watch rows removed to make way for the file's.
        `skipped` lists the first 200 refusals only; `skipped_total` and
        `skipped_by_reason` always count every one.
      type: object
      required:
        [movies_total, shows_total, movies_materialised, shows_materialised,
         history_inserted, history_replaced, ratings_upserted, watchlist_inserted,
         favorites_inserted,
         skipped_total, skipped_by_reason, skipped]
      properties:
        movies_total:
          type: integer
          description: Distinct movies the file names.
        shows_total:
          type: integer
          description: Distinct shows the file names.
        movies_materialised:
          type: integer
          description: Movies fetched from TMDB because they were not yet in the catalog.
        shows_materialised:
          type: integer
        history_inserted:
          type: integer
        history_replaced:
          type: integer
        ratings_upserted:
          type: integer
        watchlist_inserted:
          type: integer
          description: New watchlist rows only; an item already listed keeps its `added_at`.
        favorites_inserted:
          type: integer
          description: New favorite rows only; an item already favorited keeps its `added_at`.
        skipped_total:
          type: integer
        skipped_by_reason:
          type: object
          additionalProperties:
            type: integer
        skipped:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/RestoreSkip"
    RestoreSkip:
      description: >
        One entry the import did not take, and why. Position fields are filled
        as far as the entry carried them. `reason` is a stable code.
      type: object
      required: [kind, type, tmdb_id, show_tmdb_id, season, episode, reason, title, hint, tmdb_last_episode]
      properties:
        kind:
          type: string
          enum: [history, rating, watchlist, favorite]
        type:
          type: string
          description: The entry's `type` as the file gave it.
        tmdb_id:
          type: [integer, "null"]
          format: int64
        show_tmdb_id:
          type: [integer, "null"]
          format: int64
        season:
          type: [integer, "null"]
        episode:
          type: [integer, "null"]
        reason:
          type: string
          enum:
            - missing_tmdb_id
            - unknown_type
            - missing_position
            - invalid_timestamp
            - future_timestamp
            - invalid_watch_type
            - rating_out_of_range
            - season_rating_unsupported
            - watchlist_target_unsupported
            - movie_not_found
            - movie_unavailable
            - show_not_found
            - show_unavailable
            - provider_unavailable
            - episode_not_found
        title:
          type: [string, "null"]
          description: >
            The movie's title, or for a show, season or episode entry the
            show's, when sofalog's catalog holds it; filled when the job
            finishes. Null for an item TMDB never gave sofalog.
        hint:
          type: [string, "null"]
          enum: [specials_numbering, season_missing, past_season_end, numbering_gap, null]
          description: >
            The likely cause of an `episode_not_found`, deduced from the
            numbers TMDB lists for that season; null for every other reason.
            `specials_numbering`: season 0, which Trakt and TMDB number
            differently. `season_missing`: TMDB lists no such season.
            `past_season_end`: the number is above the season's last —
            typically the second half of a two-parter TMDB lists as one.
            `numbering_gap`: TMDB lists numbers on both sides but not this
            one — the same merge, mid-season.
        tmdb_last_episode:
          type: [integer, "null"]
          description: TMDB's highest episode number in that season, beside `past_season_end` and `numbering_gap`.
    RestoreError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [cancelled, internal]
        message:
          type: string
    StreamingProvider:
      description: >
        One service the item is available on, in the configured watch region —
        a tile of the details pages' "Watch now" section (D-022). Sourced from
        TMDB's watch-provider data, which TMDB sources from JustWatch.
      type: object
      required: [provider_id, name, offer, logo]
      properties:
        provider_id:
          type: integer
          format: int64
          description: >
            TMDB's stable id for the service. It addresses no endpoint here —
            it is the render key, which the name is not, since two services can
            share a display name across regions.
        name:
          type: string
          example: Netflix
        offer:
          type: string
          enum: [stream, free, ads, rent, buy]
          description: >
            How the item is available, at its STRONGEST offer only: a service
            listed under both rent and buy appears once, as `rent`. Order of
            strength is the order above.
        logo:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied provider mark
            (`api/v1/video/posters/…`), or null when TMDB has no logo for the
            service — clients fall back to a name monogram. Never a provider
            URL.
          example: api/v1/video/posters/w185/nf.jpg
    Streaming:
      description: >
        Where an item can be watched online, in ONE country (D-022). The data
        rides the movie and show metadata snapshots, so it renders with TMDB
        unreachable and is only as current as `fetched_at`. Seasons and
        episodes have no listing of their own — TMDB publishes providers per
        movie and per show — so those views carry the OWNING SHOW's.


        The property carrying this object is NULLABLE, and null is not the same
        answer as an empty `providers`: null means no listing was available to
        read (a season or episode of an untracked show, or a snapshot that has
        no listing yet), and clients show nothing; `providers: []` means TMDB
        answered for this country and named nobody, which clients state
        explicitly.
      type: object
      required: [region, link, providers]
      properties:
        region:
          type: string
          description: >
            The ISO-3166-1 alpha-2 country the listing is for, from the
            server's TMDB_WATCH_REGION. Always present, including when
            `providers` is empty — "nothing in DE" is the answer, not "no
            answer".
          example: US
        link:
          type: string
          nullable: true
          description: >
            JustWatch's page for this item in `region`, or null when the
            snapshot carries none.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/StreamingProvider"
          description: >
            Ordered strongest offer first, then TMDB's display priority, then
            name. Never null; [] when nothing is listed for the region. Capped
            at 12 entries — a longer row stops being an answer.
    SimilarTitle:
      description: >
        One card of the details pages' "Similar" rail — TMDB's recommendations
        for the item (D-024). Always the SAME kind as the page it hangs off: a
        movie's list holds movies and a show's holds shows, which is why there
        is no `media_type`. Pure provider data out of the item's own snapshot:
        the title named has no catalog row, so clients reach its details page
        by `?tmdb_id=`, and its poster is a cache-proxy URL only — it is not
        the item's artwork and is never filed under the item's asset
        directory. Nullable fields are always present, serialized as null.
      type: object
      required: [tmdb_id, title, year, rating, poster, poster_full]
      properties:
        tmdb_id:
          type: integer
          format: int64
          description: TMDB's id for the recommended title.
        title:
          type: string
          description: TMDB's `title` (movie) or `name` (show).
        year:
          type: string
          nullable: true
          description: >
            Release year (movie) or premiere year (show), or null when TMDB has
            no date.
          example: "2003"
        rating:
          type: number
          format: double
          nullable: true
          description: >
            TMDB community score (0–10); null when TMDB reports 0 ("unrated").
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied poster thumb
            (`api/v1/video/posters/w185/…`), or null when TMDB has none. Never
            a provider URL.
          example: api/v1/video/posters/w185/r.jpg
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the detail size (`w500`); null exactly when
            `poster` is.
    PersonDetails:
      description: >
        The person page (D-027): TMDB's `/person/{id}` with combined credits
        and external ids, projected — never a raw provider response — and
        marked against the caller's library. Always live: there is no `id`
        (a person is never a catalog row) and no `fetched_at` (the answer is
        always now). Nullable fields are always present, serialized as null;
        arrays are never null.
      type: object
      required:
        - tmdb_id
        - name
        - biography
        - known_for_department
        - birthday
        - deathday
        - place_of_birth
        - also_known_as
        - homepage
        - imdb_id
        - photo
        - photo_full
        - credits
      properties:
        tmdb_id:
          type: integer
          format: int64
        name:
          type: string
        biography:
          type: string
          nullable: true
          description: TMDB's biography text, or null when it has none.
        known_for_department:
          type: string
          nullable: true
          description: >
            The craft TMDB files the person under — "Acting", "Directing",
            "Writing", … Names the person's department when the acting credits
            below are not the whole story.
          example: Acting
        birthday:
          type: string
          format: date
          nullable: true
        deathday:
          type: string
          format: date
          nullable: true
        place_of_birth:
          type: string
          nullable: true
        also_known_as:
          type: array
          items:
            type: string
          description: Other names TMDB lists, blanks dropped. Never null.
        homepage:
          type: string
          nullable: true
          description: An outbound link the user leaves the app through.
        imdb_id:
          type: string
          nullable: true
          description: IMDb's name id, for the outbound IMDb link.
          example: nm0000093
        photo:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied portrait thumb
            (`api/v1/video/posters/w185/…`), or null when TMDB has none. Never
            a provider URL, and never a data/assets path — a person owns no
            asset directory.
        photo_full:
          type: string
          nullable: true
          description: >
            The same portrait at TMDB's profile detail size (`h632`); null
            exactly when `photo` is.
        credits:
          type: array
          items:
            $ref: "#/components/schemas/PersonCredit"
          description: >
            Acting credits, one per title, undated first then newest first
            (ties on title). Never null; [] when TMDB lists none. Not capped —
            capping is presentation.
    PersonCredit:
      description: >
        One filmography card: a title the person acted in, addressed by
        `tmdb_id` like a search result, plus two library fields from a local
        join — `id` when the catalog holds the title (the card can then link
        by local id) and this user's `watched`. Nullable fields are always
        present, serialized as null.
      type: object
      required:
        - media_type
        - tmdb_id
        - title
        - year
        - character
        - rating
        - poster
        - poster_full
        - episodes
        - id
        - watched
        - in_history
      properties:
        media_type:
          type: string
          enum: [movie, show]
        tmdb_id:
          type: integer
          format: int64
          description: TMDB's id for the title, in its own kind's namespace.
        title:
          type: string
          description: TMDB's `title` (movie) or `name` (show).
        year:
          type: string
          nullable: true
          description: >
            Release year (movie) or premiere year (show), or null when TMDB has
            no date.
          example: "1999"
        character:
          type: string
          nullable: true
          description: >
            The part, or the parts joined with " / " when TMDB credited the
            person more than once in the title — one card per title, never one
            per part. Null when TMDB names no part.
        rating:
          type: number
          format: double
          nullable: true
          description: >
            TMDB community score (0–10); null when TMDB reports 0 ("unrated").
        poster:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied poster thumb
            (`api/v1/video/posters/w185/…`), or null when TMDB has none. A
            cache-proxy URL only, even for a title the library holds.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the detail size (`w500`); null exactly when
            `poster` is.
        episodes:
          type: integer
          nullable: true
          description: >
            How many episodes the person appears in — a SHOW figure, the
            largest count among their parts (not the sum, which could exceed
            the show). Null for a movie.
        id:
          type: integer
          format: int64
          nullable: true
          description: >
            The title's local catalog id when the library holds it — "in your
            library" — or null. A client links by `?id=` when present and by
            `?tmdb_id=` otherwise.
        watched:
          type: boolean
          description: >
            Whether THIS user has watched the title — the watchlist page's
            meaning per kind: a movie, any watch in the log; a show, completed
            (its status reached `watched`). Always false when `id` is null.
        in_history:
          type: boolean
          description: >
            Whether any watch of the title is in THIS user's log — for a show,
            ANY episode, finished or not. Contrast `watched`, which for a show
            means completed: a half-watched show is in the history and not
            watched. What the page's "Seen with" grid filters on. Always false
            when `id` is null.
    CastMember:
      description: >
        One credited actor. Nullable fields are always present, serialized as
        null.
      type: object
      required: [tmdb_id, name, character, photo, episodes]
      properties:
        tmdb_id:
          type: integer
          format: int64
          nullable: true
          description: >
            TMDB's person id — what `/video/people/details` is addressed by
            (D-027). Null when the stored snapshot carries none (a real TMDB
            body always does); a client links the card to the person page
            only when present.
        name:
          type: string
        character:
          type: string
          nullable: true
          description: >
            The part played. On a show, an actor credited with several parts
            across the run has them joined with " / ", most episodes first.
        photo:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied profile photo
            (api/v1/video/posters/w185/...), or null when TMDB has none.
        episodes:
          type: integer
          nullable: true
          description: >
            How many episodes the actor appears in, from TMDB's aggregate
            credits — across the show on a show page, within the season on a
            season page. Null for a movie.
    MovieVideo:
      description: >
        One video TMDB lists for a movie. YouTube only — other sites are
        dropped, because TMDB stores no frames and only YouTube's CDN can
        supply a thumbnail. Nullable fields are always present, serialized as
        null.
      type: object
      required: [name, type, official, published_at, url, thumb]
      properties:
        name:
          type: string
          description: TMDB's title for the video, e.g. "Official Trailer".
        type:
          type: string
          description: >
            TMDB's category — Trailer, Teaser, Clip, Featurette, Behind the
            Scenes, Bloopers. Render it as a label; do not branch on it.
        official:
          type: boolean
          description: Whether TMDB marks the video as published by the studio.
        published_at:
          type: string
          nullable: true
          description: When the video was published (RFC3339).
        url:
          type: string
          description: >
            YouTube watch URL. An outbound link the user leaves the app
            through — legitimately external, like `homepage` and `trailer_url`.
        thumb:
          type: string
          nullable: true
          description: >
            Relative URL of the locally proxied still frame
            (api/v1/video/youtube-thumbs/...), or null when the video's id is
            unusable. Never a provider URL (D-017).
    MovieImage:
      description: >
        One gallery image at both locally proxied variants. Backdrops use the
        w300/w1280 pair, posters w185/w500 — both proxied through
        /video/posters/{size}/{file}, never a provider URL.
      type: object
      required: [thumb, full, width, height]
      properties:
        thumb:
          type: string
          description: Relative URL of the small variant, for the gallery rail.
        full:
          type: string
          description: Relative URL of the large variant, for the lightbox.
        width:
          type: integer
          description: >
            The full variant's provider width in pixels, so a client can lay
            the tile out at the right shape before the image loads.
        height:
          type: integer
          description: The full variant's provider height in pixels.
    UpNextEntry:
      description: >
        One card on the "Up Next To Watch" page: the next unwatched episode of
        a started show plus that show's derived progress. Nullable fields are
        always present, serialized as null.
      type: object
      required: [show, poster, poster_full, episode, last_watched_at, progress]
      properties:
        show:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        poster:
          type: string
          nullable: true
          description: >
            Relative asset path of the grid-sized poster (w185), or null when
            no poster is stored.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the full size (w500); null exactly when
            `poster` is. Cards offer both through `srcset`.
        episode:
          type: object
          required:
            [id, season_id, season, number, title, air_date, rating, marker, aired]
          properties:
            id:
              type: integer
              format: int64
            season_id:
              type: integer
              format: int64
              nullable: true
              description: >
                The local `seasons.id`, and the only handle in this object that
                addresses anything — an episode has no id-addressed endpoint, so
                `/video/episodes/details` is reached with this plus `number`.
                Null only if the season row has gone; an episode row is written
                only by tracking, in the same transaction that links its season.
            season:
              type: integer
            number:
              type: integer
            title:
              type: string
            air_date:
              type: string
              format: date
              nullable: true
            rating:
              type: number
              nullable: true
              description: >
                TMDB community score (0-10) from the stored metadata snapshot,
                not a user rating.
            marker:
              type: string
              enum: [season_premiere, mid_season_finale, season_finale]
              nullable: true
            aired:
              type: boolean
              description: >
                Whether the episode has aired, computed server-side against
                the user's today in their time zone (D-038) — false for a
                future or unknown air date. Clients
                render the "Upcoming" badge from this and never derive it.
        last_watched_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When this user last watched any episode of the show, RFC3339 UTC.
            The maximum `watched_at` over the watch log, so it carries the
            same precision as its source. Only started shows are listed, so
            in practice it is never null; the shape stays nullable.
        progress:
          type: object
          required: [watched, aired_total, total]
          properties:
            watched:
              type: integer
            aired_total:
              type: integer
            total:
              type: integer
    UpcomingEntry:
      description: >
        One dated row of the upcoming calendar. `show` + `episode` and `movie`
        form a discriminated union keyed by `kind`: for an episode both `show`
        and `episode` are non-null and `movie` is null; for a movie the
        reverse. Nullable fields are always present, serialized as null. No
        rating and no `aired` flag: an upcoming episode is unaired-or-today by
        construction and has no community score yet.
      type: object
      required: [date, kind, poster, poster_full, show, episode, movie]
      properties:
        date:
          type: string
          format: date
          description: >
            The day the entry lands on — the episode's air date or the movie's
            release date as TMDB states it. A day, not an instant.
        kind:
          type: string
          enum: [episode, movie]
        poster:
          type: string
          nullable: true
          description: >
            Relative asset path, or null. Grid-sized (w185): the season poster
            falling back to the show's for an episode, the movie's for a movie.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the full size (w500); null exactly when
            `poster` is. Cards offer both through `srcset`.
        show:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        episode:
          type: object
          nullable: true
          required: [id, season_id, season, number, title, marker]
          properties:
            id:
              type: integer
              format: int64
            season_id:
              type: integer
              format: int64
              nullable: true
              description: >
                The local `seasons.id` — the handle `/video/episodes/details`
                is reached with, plus `number`. Null only if the season row
                has gone.
            season:
              type: integer
            number:
              type: integer
            title:
              type: string
            marker:
              type: string
              enum: [season_premiere, mid_season_finale, season_finale]
              nullable: true
        movie:
          type: object
          nullable: true
          required: [id, title]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
    MatchUser:
      description: >
        One account the caller may intersect their watchlist with (D-028).
        Id and label only — deliberately not the admin list's `UserListEntry`,
        and never an email.
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
          format: int64
          description: The value `match_user` takes.
        label:
          type: string
          description: >
            The display name, or the email's local part when none is set —
            the same fallback the UI applies everywhere, done server-side.
    ListSummary:
      description: One card on the Lists hub.
      type: object
      required: [key, movies, shows, backdrops, backdrops_full]
      properties:
        key:
          type: string
          enum: [watchlist, favorites, dropped]
        movies:
          type: integer
          minimum: 0
          description: Movies on the list. Always 0 for `dropped`.
        shows:
          type: integer
          minimum: 0
          description: Shows on the list.
        backdrops:
          type: array
          maxItems: 4
          description: >
            Relative URLs of grid-sized backdrops (w300) from the list's most
            recently added items, newest first. Items without a backdrop are
            skipped. Never null — `[]` for an empty list or one whose items
            have no artwork.
          items:
            type: string
        backdrops_full:
          type: array
          maxItems: 4
          description: >
            The same backdrops at the full size (w1280), in the same order and
            of the same length as `backdrops` — the card offers each pair
            through `srcset`. Never null.
          items:
            type: string
    Stats:
      description: >
        The Stats page for one user and one period. Nullable sections are
        always present, serialized as null; lists are never null.
      type: object
      required:
        [period, years, today, headline, most_watched_show, ratings, top_rated,
         rating_trend, crowd, unrated_movies, activity, decades, most_rewatched,
         completion, genres]
      properties:
        period:
          type: string
          description: The APPLIED period — `all` or a four-digit year.
        years:
          type: array
          description: >
            Every year the filter offers, newest first: from the earlier of
            the first play and the first rating through the current year.
            Empty when nothing was recorded.
          items:
            type: integer
        today:
          type: string
          format: date
          description: The user's calendar day (D-038), the anchor of "ago", the heatmap and the streaks.
        headline:
          $ref: "#/components/schemas/StatsHeadline"
        most_watched_show:
          allOf: [{ $ref: "#/components/schemas/StatsMostWatchedShow" }]
          nullable: true
          description: Null without an episode play in the period.
        ratings:
          allOf: [{ $ref: "#/components/schemas/StatsRatings" }]
          nullable: true
          description: Null without a rating in the period.
        top_rated:
          type: array
          maxItems: 10
          description: Highest-rated movies and shows — rating, then most recently rated.
          items:
            $ref: "#/components/schemas/StatsTopRated"
        rating_trend:
          allOf: [{ $ref: "#/components/schemas/StatsRatingTrend" }]
          nullable: true
          description: Null without a movie or show rating in the period.
        crowd:
          allOf: [{ $ref: "#/components/schemas/StatsCrowd" }]
          nullable: true
          description: Null when fewer than 5 rated titles can be compared with TMDB.
        unrated_movies:
          allOf: [{ $ref: "#/components/schemas/StatsUnratedMovies" }]
          nullable: true
          description: Null when every watched movie has a rating in the period.
        activity:
          $ref: "#/components/schemas/StatsActivity"
        decades:
          allOf: [{ $ref: "#/components/schemas/StatsDecades" }]
          nullable: true
          description: Null when no watched title has a release year.
        most_rewatched:
          type: array
          maxItems: 5
          description: Titles played more than once, most plays first; a show's count is the sum of its episode plays.
          items:
            $ref: "#/components/schemas/StatsRewatched"
        completion:
          allOf: [{ $ref: "#/components/schemas/StatsCompletion" }]
          nullable: true
          description: Null for a year (the state table has no dates) and when no show is followed.
        genres:
          allOf: [{ $ref: "#/components/schemas/StatsGenres" }]
          nullable: true
          description: Null when the period holds no watched title.

    StatsTitle:
      description: >
        A movie or a show a section refers to. An episode is never a title —
        it refers to its show. Every stats title is tracked, so its artwork is
        the item's own, served from disk or through the cache proxy.
      type: object
      required: [kind, id, title, year, poster, poster_full, backdrop, backdrop_full]
      properties:
        kind:
          type: string
          enum: [movie, show]
        id:
          type: integer
          format: int64
          description: The local catalog id.
        title:
          type: string
        year:
          type: integer
          nullable: true
          description: Release / first-air year; null when undated.
        poster:
          type: string
          nullable: true
          description: Grid-sized (w185) relative URL; null without a poster.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the full size (w500); null exactly when
            `poster` is. Cards offer both through `srcset`.
        backdrop:
          type: string
          nullable: true
          description: Grid-sized (w300) relative URL; null without a backdrop.
        backdrop_full:
          type: string
          nullable: true
          description: >
            The same backdrop at the full size (w1280); null exactly when
            `backdrop` is. Banners offer both through `srcset`.

    StatsHeadline:
      type: object
      required: [hours, plays, movies, episodes, movie_minutes, episode_minutes]
      properties:
        hours:
          type: integer
          description: (movie minutes + episode minutes) / 60, floored. A play with no known runtime counts 0.
        plays:
          type: integer
          description: Watch-log rows in the period — a rewatch is a second play.
        movies:
          type: integer
          description: Distinct movies with at least one play.
        episodes:
          type: integer
          description: Distinct episodes with at least one play.
        movie_minutes:
          type: integer
        episode_minutes:
          type: integer
          description: >
            An episode's own runtime, else its show's regular runtime, else 0.
            Both halves 0 means no runtime is known yet.

    StatsMostWatchedShow:
      type: object
      required: [show, minutes, plays, last_played_at]
      properties:
        show:
          $ref: "#/components/schemas/StatsTitle"
        minutes:
          type: integer
        plays:
          type: integer
          description: Episode plays.
        last_played_at:
          type: string
          format: date-time

    StatsRatings:
      type: object
      required: [distribution, count, average, movies_average, shows_average, episodes_average]
      properties:
        distribution:
          type: array
          minItems: 10
          maxItems: 10
          description: How many ratings of each value were given; index 0 is rating 1.
          items:
            type: integer
        count:
          type: integer
        average:
          type: number
        movies_average:
          type: number
          nullable: true
        shows_average:
          type: number
          nullable: true
        episodes_average:
          type: number
          nullable: true

    StatsTopRated:
      type: object
      required: [title, rating, rated_at]
      properties:
        title:
          $ref: "#/components/schemas/StatsTitle"
        rating:
          type: integer
          minimum: 1
          maximum: 10
        rated_at:
          type: string
          format: date-time

    StatsRatingTrend:
      description: >
        Movie and show ratings over time. Episode ratings are left out: they
        come in binge bursts and would track what was watched, not how it was
        judged.
      type: object
      required: [months, recent, earlier, delta, verdict, reference_at]
      properties:
        months:
          type: array
          minItems: 12
          maxItems: 12
          description: Oldest first — the 12 months ending with the current one, or January to December of the year.
          items:
            $ref: "#/components/schemas/StatsRatingMonth"
        recent:
          allOf: [{ $ref: "#/components/schemas/StatsRatingSample" }]
          description: Ratings in the 90 days before `reference_at`.
        earlier:
          allOf: [{ $ref: "#/components/schemas/StatsRatingSample" }]
          description: Every rating before that window, within the period.
        delta:
          type: number
          nullable: true
          description: Recent minus earlier, rounded to one decimal; null unless both sides hold at least 3 ratings.
        verdict:
          type: string
          nullable: true
          enum: [harsher, kinder, steady, null]
          description: From the rounded delta — at or below −0.3 harsher, at or above 0.3 kinder; null with `delta`.
        reference_at:
          type: string
          format: date-time
          description: The window's end — now, or the end of a past year.

    StatsRatingMonth:
      type: object
      required: [month, count, average]
      properties:
        month:
          type: string
          description: YYYY-MM in the user's zone.
        count:
          type: integer
        average:
          type: number
          nullable: true

    StatsRatingSample:
      type: object
      required: [count, average]
      properties:
        count:
          type: integer
        average:
          type: number
          nullable: true

    StatsCrowd:
      description: >
        The user's movie and show ratings against TMDB's averages out of the
        stored snapshots — never a fetch. A title is compared only when its
        average rests on at least 50 votes; both averages are over the compared
        titles only.
      type: object
      required: [user_average, crowd_average, delta, verdict, compared, total_rated, loved_more, loved_less]
      properties:
        user_average:
          type: number
        crowd_average:
          type: number
        delta:
          type: number
          description: User minus crowd.
        verdict:
          type: string
          enum: [harsher, kinder, in_sync]
          description: At or below −0.5 harsher, at or above 0.5 kinder.
        compared:
          type: integer
        total_rated:
          type: integer
          description: Movie and show ratings in the period, compared or not.
        loved_more:
          type: array
          maxItems: 3
          description: Titles the user rated above TMDB, largest gap first.
          items:
            $ref: "#/components/schemas/StatsCrowdEntry"
        loved_less:
          type: array
          maxItems: 3
          description: Titles the user rated below TMDB, largest gap first. An exact match is in neither list.
          items:
            $ref: "#/components/schemas/StatsCrowdEntry"

    StatsCrowdEntry:
      type: object
      required: [title, user_rating, tmdb_average, tmdb_votes, gap]
      properties:
        title:
          $ref: "#/components/schemas/StatsTitle"
        user_rating:
          type: integer
        tmdb_average:
          type: number
        tmdb_votes:
          type: integer
          format: int64
        gap:
          type: number
          description: User rating minus TMDB average.

    StatsUnratedMovies:
      type: object
      required: [total, recent]
      properties:
        total:
          type: integer
          description: Watched movies with no movie rating in the period (in a year, "rated" means rated that year).
        recent:
          type: array
          maxItems: 5
          description: The most recently played of them first.
          items:
            $ref: "#/components/schemas/StatsUnratedMovie"

    StatsUnratedMovie:
      type: object
      required: [movie, last_played_at]
      properties:
        movie:
          $ref: "#/components/schemas/StatsTitle"
        last_played_at:
          type: string
          format: date-time

    StatsActivity:
      type: object
      required:
        [months, heatmap, weekday, time_of_day, longest_streak, current_streak,
         tracking_days, active_days, first_play]
      properties:
        months:
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: "#/components/schemas/StatsMonthPlays"
        heatmap:
          $ref: "#/components/schemas/StatsHeatmap"
        weekday:
          type: array
          minItems: 7
          maxItems: 7
          description: Plays per local weekday, Monday first.
          items:
            type: integer
        time_of_day:
          allOf: [{ $ref: "#/components/schemas/StatsTimeOfDay" }]
          nullable: true
          description: >
            Null when no play has a real time of day. A play at exactly local
            midnight is left out: the bulk "mark on air dates" modes stamp
            that instant.
        longest_streak:
          type: integer
          description: The longest run of consecutive local days with a play; 0 without plays.
        current_streak:
          type: integer
          nullable: true
          description: >
            The run ending on the latest play day, if that day is today or
            yesterday, else 0. Null in a past year.
        tracking_days:
          type: integer
          nullable: true
          description: Days from the first play's day to today, at least 1. All time only, null without a play.
        active_days:
          type: integer
          nullable: true
          description: Days with a play in the year. A year only.
        first_play:
          allOf: [{ $ref: "#/components/schemas/StatsFirstPlay" }]
          nullable: true
          description: The oldest play of the period; null without one.

    StatsMonthPlays:
      type: object
      required: [month, plays]
      properties:
        month:
          type: string
          description: YYYY-MM in the user's zone.
        plays:
          type: integer

    StatsHeatmap:
      description: >
        One cell per day — the 365 days ending today for all time, the whole
        calendar year otherwise (future days 0). Levels are 0 for no plays,
        else 1–4 by the quartiles of the active days' counts, the busiest day
        always 4.
      type: object
      required: [start, plays, levels]
      properties:
        start:
          type: string
          format: date
          description: The first cell's day.
        plays:
          type: array
          items:
            type: integer
        levels:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 4

    StatsTimeOfDay:
      type: object
      required: [morning, afternoon, evening, night, dominant]
      properties:
        morning:
          type: integer
          description: Plays between 05:00 and 11:59 local.
        afternoon:
          type: integer
          description: 12:00–16:59.
        evening:
          type: integer
          description: 17:00–21:59.
        night:
          type: integer
          description: 22:00–04:59.
        dominant:
          type: string
          enum: [morning, afternoon, evening, night]
          description: The fullest part; a tie goes to the earlier one.

    StatsFirstPlay:
      type: object
      required: [title, episode, watched_at]
      properties:
        title:
          allOf: [{ $ref: "#/components/schemas/StatsTitle" }]
          description: The movie, or the episode's show.
        episode:
          allOf: [{ $ref: "#/components/schemas/StatsEpisodeRef" }]
          nullable: true
          description: The episode's position; null for a movie.
        watched_at:
          type: string
          format: date-time

    StatsEpisodeRef:
      type: object
      required: [season, number]
      properties:
        season:
          type: integer
        number:
          type: integer

    StatsDecades:
      description: >
        Distinct watched titles by release decade — each movie once, each
        show with a played episode once.
      type: object
      required: [buckets, favorite, oldest, newest, covered, total]
      properties:
        buckets:
          type: array
          description: Contiguous from the oldest to the newest decade, oldest first, empty decades present as 0.
          items:
            $ref: "#/components/schemas/StatsDecade"
        favorite:
          type: integer
          description: The fullest decade's first year; a tie goes to the more recent.
        oldest:
          allOf: [{ $ref: "#/components/schemas/StatsEraTitle" }]
          nullable: true
        newest:
          allOf: [{ $ref: "#/components/schemas/StatsEraTitle" }]
          nullable: true
          description: Null when only one title has a year.
        covered:
          type: integer
          description: Titles with a year.
        total:
          type: integer
          description: Distinct watched titles.

    StatsDecade:
      type: object
      required: [decade, titles]
      properties:
        decade:
          type: integer
          description: The decade's first year, e.g. 1990.
        titles:
          type: integer

    StatsEraTitle:
      type: object
      required: [title, year]
      properties:
        title:
          $ref: "#/components/schemas/StatsTitle"
        year:
          type: integer

    StatsRewatched:
      type: object
      required: [title, plays, last_played_at]
      properties:
        title:
          $ref: "#/components/schemas/StatsTitle"
        plays:
          type: integer
        last_played_at:
          type: string
          format: date-time

    StatsCompletion:
      description: >
        Every followed, non-dropped show (all time only). Completed is aired
        > 0 and watched ≥ aired; the average is over shows with an aired
        episode; "almost there" are the shows closest to done — fewest
        episodes left, then the higher ratio.
      type: object
      required: [tracked, completed, in_progress, average_completion, almost_there]
      properties:
        tracked:
          type: integer
        completed:
          type: integer
        in_progress:
          type: integer
        average_completion:
          type: number
          minimum: 0
          maximum: 1
        almost_there:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/StatsAlmostThere"

    StatsAlmostThere:
      type: object
      required: [show, watched, aired, left]
      properties:
        show:
          $ref: "#/components/schemas/StatsTitle"
        watched:
          type: integer
        aired:
          type: integer
        left:
          type: integer

    StatsGenres:
      description: >
        How many of the period's distinct watched titles (movies and shows
        alike) list each genre name, each title once per name.
      type: object
      required: [entries, covered, total]
      properties:
        entries:
          type: array
          maxItems: 5
          description: Most titles first, then name.
          items:
            $ref: "#/components/schemas/StatsGenre"
        covered:
          type: integer
          description: Titles with at least one genre.
        total:
          type: integer
          description: Distinct watched titles.

    StatsGenre:
      type: object
      required: [name, titles]
      properties:
        name:
          type: string
        titles:
          type: integer

    DroppedEntry:
      description: >
        One entry on the dropped page: the watchlist card's shape exactly, with
        `target_type` always `show` (so `movie` is always null), `added_at` the
        instant the show was dropped, and `watched` always false — the stored
        status is `dropped`.
      allOf:
        - $ref: "#/components/schemas/WatchlistEntry"
    FavoriteEntry:
      description: >
        One entry on the favorites page (D-030): the watchlist card's shape
        exactly — the same union, the same nullable rules, the same meaning of
        `watched` per kind — with `added_at` the instant the title was
        favorited rather than listed.
      allOf:
        - $ref: "#/components/schemas/WatchlistEntry"
    WatchlistEntry:
      description: >
        One entry on the watchlist. `movie` and `show` form a discriminated
        union keyed by `target_type` — exactly one of them is non-null, and the
        other is present as null. There is deliberately no top-level target id:
        the pair (`target_type`, that object's `id`) identifies the target, and
        an id alone identifies nothing, because movie 5 and episode 5 both
        exist. Nullable fields are always present, serialized as null.


        The list holds at most one row per target, so that object's `id` is a
        stable list key.
      type: object
      required:
        [
          added_at,
          target_type,
          poster,
          poster_full,
          rating,
          user_rating,
          watched,
          movie,
          show,
        ]
      properties:
        added_at:
          type: string
          format: date-time
          description: >
            The instant the item was put on the list, RFC3339 UTC. Render it in
            the user's time zone (`User.effective_timezone`, D-038); the server
            never emits an offset, and that day can therefore differ from the
            UTC day near midnight.
        target_type:
          type: string
          enum: [movie, show]
        poster:
          type: string
          nullable: true
          description: >
            Relative asset path of the grid-sized poster (w185), or null when
            no poster is stored.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the full size (w500); null exactly when
            `poster` is. Cards offer both through `srcset`.
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score (0-10) from the stored metadata snapshot, not
            a user rating; null when the snapshot has none.
        user_rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
          description: This user's rating of the target, or null when unrated.
        watched:
          type: boolean
          description: >
            Whether this user has watched the target. True alongside a
            watchlist entry is expected, not contradictory: the watchlist is an
            independent axis and never a status (D-011).


            For a movie: any watch in the log. For a show: COMPLETED — the
            stored status has reached `watched`, meaning every aired,
            non-special episode (D-012). Partway through a show is `false`
            here; the show's own page carries the partial figure.
        movie:
          nullable: true
          description: Non-null if and only if target_type is `movie`.
          type: object
          required: [id, title, release_date]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
            release_date:
              type: string
              nullable: true
              description: YYYY-MM-DD, or null when the snapshot has no date.
        show:
          nullable: true
          description: >
            Non-null if and only if target_type is `show`. A show carries a
            `name` where a movie carries a `title`: the two catalog tables keep
            their own vocabulary, and one list holds both.
          type: object
          required: [id, name, first_air_date]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            first_air_date:
              type: string
              nullable: true
              description: >
                YYYY-MM-DD, or null when the snapshot has no date. A show's
                release date: this is what `order_by=release_date` sorts it on.

    HistoryEntry:
      description: >
        One entry in the watch-history feed: exactly one recorded watch.
        `movie` and `episode` form a discriminated union keyed by
        `target_type` — exactly one of them is non-null, and the other is
        present as null. There is deliberately no top-level target id: the
        pair (`target_type`, that object's `id`) identifies the target, and an
        id alone identifies nothing, because movie 5 and episode 5 both exist.
        Nullable fields are always present, serialized as null.
      type: object
      required:
        [
          id,
          watched_at,
          watch_type,
          target_type,
          poster,
          poster_full,
          user_rating,
          rating,
          movie,
          episode,
        ]
      properties:
        id:
          type: integer
          format: int64
          description: >
            The watch-row id. Unique per entry and stable, unlike the target
            id, which repeats across rewatches.
        watched_at:
          type: string
          format: date-time
          description: >
            The instant the watch happened, RFC3339 UTC — an instant, not a
            day, so a same-day rewatch is orderable and the client can show a
            time. It is not when the row was written: a backdated entry has an
            older `watched_at`. Render it in the user's time zone
            (`User.effective_timezone`, D-038); the server never emits an
            offset, and that day can therefore differ from the UTC day near
            midnight.
        watch_type:
          type: string
          enum: [watch, checkin, scrobble]
          description: >
            Provenance only: how the watch was captured. No query and no
            client may branch on this value. Only `watch` occurs today; the
            features producing the other two are deferred.
        target_type:
          type: string
          enum: [movie, episode]
        poster:
          type: string
          nullable: true
          description: >
            Relative asset path of the grid-sized poster (w185), or null when
            no poster is stored. Resolved server-side for both kinds: the
            movie poster, or for an episode the season poster falling back to
            the show poster.
        poster_full:
          type: string
          nullable: true
          description: >
            The same poster at the full size (w500); null exactly when
            `poster` is. Cards offer both through `srcset`.
        user_rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
          description: >
            This user's rating of the watched target, or null when unrated. Not
            a provider score. A rating belongs to the target rather than to the
            watch — re-rating overwrites and no rating history is kept — so two
            entries for the same target always carry the same value.
        rating:
          type: number
          nullable: true
          description: >
            TMDB community score (0-10) of the watched target from the stored
            metadata snapshot, not a user rating; null when the snapshot has
            none. Belongs to the target's snapshot, not to the watch, so two
            entries for the same target always carry the same value.
        movie:
          nullable: true
          description: Non-null if and only if target_type is `movie`.
          type: object
          required: [id, title, release_date]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
            release_date:
              type: string
              format: date
              nullable: true
        episode:
          nullable: true
          description: Non-null if and only if target_type is `episode`.
          type: object
          required: [id, show, season_id, season, number, title]
          properties:
            id:
              type: integer
              format: int64
            show:
              type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                  format: int64
                name:
                  type: string
            season_id:
              type: integer
              format: int64
              nullable: true
              description: >
                The local `seasons.id`, and the only handle in this object that
                addresses anything — an episode has no id-addressed endpoint, so
                `/video/episodes/details` is reached with this plus `number`.
                Null only if the season row has gone; an episode row is written
                only by tracking, in the same transaction that links its season.
            season:
              type: integer
            number:
              type: integer
            title:
              type: string
    User:
      description: >
        A user account as the API returns it. Never carries the password
        hash.
      type: object
      required: [id, email, display_name, is_admin, match_watchlist, timezone, effective_timezone]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
          description: The login identifier, always lowercased.
        display_name:
          type: string
          description: >
            Optional human label, empty until set. Not unique. Clients render
            the email's local part when it is empty rather than nothing.
        is_admin:
          type: boolean
        match_watchlist:
          type: boolean
          description: >
            Whether this account has allowed other users to pick it in their
            watchlist's Matching filter (D-028). Default false; only the
            account itself changes it, through
            `PUT /auth/users/{id}/match-watchlist`.
        timezone:
          type: string
          nullable: true
          example: Europe/Bucharest
          description: >
            The IANA zone this account chose (D-038), set through
            `PUT /auth/users/{id}/timezone`; null follows the server's
            `DEFAULT_TIMEZONE`.
        effective_timezone:
          type: string
          example: Europe/Bucharest
          description: >
            The zone in force: `timezone`, else the server default. It is
            where this user's day ends server-side (what has aired, the
            calendar's first day) and the zone clients render instants in —
            resolved by the server so a client never computes the fallback.
    SessionStatus:
      description: >
        The /auth/session probe result. `user` is present exactly when
        `status` is `authenticated`. `setup_required` is never returned when
        single sign-on is configured — there is no local first-run form, and
        the first sign-in provisions the first account.
      type: object
      required: [status, auth]
      properties:
        status:
          type: string
          enum: [setup_required, unauthenticated, authenticated]
        user:
          $ref: "#/components/schemas/User"
        auth:
          $ref: "#/components/schemas/AuthMethods"
    AuthMethods:
      description: >
        Which sign-in methods this deployment offers. Mutually exclusive:
        configuring an OIDC provider disables local authentication entirely.
      type: object
      required: [local, oidc]
      properties:
        local:
          type: boolean
          description: Email and password sign-in is available.
        oidc:
          type: boolean
          description: Single sign-on is available.
        oidc_name:
          type: string
          description: Provider label for the sign-in button.
    UserListEntry:
      description: >
        One row of the admin user list. Carries the join date the list
        renders; deliberately distinct from the leaner User returned by
        login and the session probe.
      type: object
      required: [id, email, display_name, is_admin, created_at, linked]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
          description: >
            The login identifier, and what an OIDC sign-in matches against to
            attach to this account.
        display_name:
          type: string
          description: Optional human label, empty until set. Not unique.
        is_admin:
          type: boolean
        created_at:
          type: string
          description: RFC3339 UTC.
        linked:
          type: boolean
          description: Whether this account already has a single sign-on identity.
    PasswordChange:
      description: >
        A password change. `current_password` is required when changing your
        own password and ignored when an admin resets someone else's.
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: 8-128 characters.
    Credentials:
      description: Email and password — for login, setup and user creation.
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: The login identifier. Uppercase input is lowercased.
        password:
          type: string
          format: password
          description: 8-128 characters.
        display_name:
          type: string
          description: >
            Optional human label, used on setup and user creation and ignored
            on login. At most 64 characters. Not unique.
    Error:
      description: >
        The one error envelope every endpoint returns. `code` is a stable
        machine string clients can branch on; `message` is human-readable.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: no such endpoint
  parameters:
    ListPage:
      name: page
      in: query
      description: 1-based TMDB page, 1–500. Default 1.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1

  responses:
    BadRequestBody:
      description: The request body is not well-formed JSON (code `invalid_body`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource or endpoint does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: A query parameter or body field has an invalid value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: >
        The metadata provider is unreachable or no credential is configured
        (code `provider_unavailable`). Only search, add, first-view
        snapshot paths (D-015) and the always-live discovery views — a
        person (D-027), the trending and popular lists (D-034) — can return
        this; the library itself is unaffected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        No valid session (code `unauthorized`). The session middleware
        returns this for any API operation outside the public set; login
        returns it on bad credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted (code `forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The request collides with something already in place (code
        `conflict`) — for the restore, a job already running for this user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sofalog_session
      description: >
        Server-side session referenced by the HTTP-only sofalog_session
        cookie, created by /auth/login, /auth/setup or the
        /auth/oidc/callback single sign-on flow, and revoked by /auth/logout.
        The session is identical whichever way it was created. API tokens for
        third-party clients arrive in M5.
