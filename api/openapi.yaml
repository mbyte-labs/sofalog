openapi: 3.0.3
info:
  title: sofalog API
  description: >
    Versioned JSON API of sofalog, a self-hosted multi-user media tracker.
    The bundled web UI is the reference client of this same API.
  version: 0.1.0

servers:
  - url: /api/v1

# Every operation requires the session cookie unless it opts out with
# `security: []` — the server enforces the same fail-closed rule.
security:
  - sessionCookie: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns 200 when the server is up. Requires no authentication.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /auth/session:
    get:
      operationId: getAuthSession
      summary: Session boot probe
      description: >
        The SPA boot probe: answers whether the instance still needs
        first-run setup and, if not, who the current session belongs to.
        Public and always 200 — the happy path never produces a 401.
      security: []
      responses:
        "200":
          description: The instance/session status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"

  /auth/setup:
    post:
      operationId: postAuthSetup
      summary: First-run setup
      description: >
        Creates the first account, as admin, and logs it in — works exactly
        once per instance. Once any user exists it returns 409; further
        accounts are created by the admin via /auth/users.


        Returns 404 when single sign-on is configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: >
            The admin account was created and logged in; the session cookie
            is set on the response.
          headers:
            Set-Cookie:
              description: The HTTP-only sofalog_session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "409":
          description: Setup already completed (code `conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Log in
      description: >
        Verifies the password and starts a server-side session. The identical
        401 is returned for an unknown email, a wrong password and an
        account without a local password — responses never reveal which
        addresses are registered.


        Returns 404 when single sign-on is configured: local authentication
        is disabled entirely on such an instance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in; the session cookie is set on the response.
          headers:
            Set-Cookie:
              description: The HTTP-only sofalog_session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Log out
      description: >
        Deletes the current session row and clears the cookie. Idempotent and
        public — an expired or missing session still gets its cookie cleared
        instead of a 401.
      security: []
      responses:
        "204":
          description: Logged out; the session cookie is expired.

  /auth/users:
    post:
      operationId: postAuthUsers
      summary: Create a user (admin only)
      description: >
        Adds an account. Admin only — registration is otherwise closed.
        Created accounts are never admins; there is no promotion path yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That email is already registered (code `conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: getAuthUsers
      summary: List accounts (admin only)
      description: >
        Every account on the instance, ordered by email. Admin only — a
        household member has no business enumerating the others. Password
        hashes are never included.
      responses:
        "200":
          description: The account list.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserListEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/users/{id}:
    delete:
      operationId: deleteAuthUser
      summary: Delete an account (admin only)
      description: >
        Deletes the account and, by database cascade, everything that user
        tracked — watch history, ratings, watchlist, states and sessions.
        Admin only, and never your own account: that rule also guarantees at
        least one admin always remains. Catalog rows and artwork that nobody
        else references are NOT removed here; collecting those is the
        deferred D-008 sweep's job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The account was deleted.
        "400":
          description: The id is not an integer (code `invalid_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/users/{id}/password:
    put:
      operationId: putAuthUserPassword
      summary: Change a password
      description: >
        An admin may reset another user's password without knowing it, in
        which case `current_password` is ignored. Changing your OWN password
        always requires `current_password` — admins included.


        The target's other sessions are revoked while the requesting device
        stays signed in, so a reset actually locks the old password out.


        Note the status choice: a wrong `current_password` is **422**, not
        401. The request is authenticated; it is the supplied value that is
        invalid, and a 401 would read as session expiry to clients.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password was changed and other sessions revoked.
        "400":
          description: Malformed body, or an id that is not an integer (`invalid_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/oidc/start:
    get:
      operationId: getAuthOIDCStart
      summary: Begin single sign-on
      description: >
        Redirects the browser to the configured identity provider. This is a
        browser-navigation endpoint, not a JSON call: link to it or set
        window.location, do not fetch it.


        Only meaningful when a provider is configured; otherwise it 404s.
      security: []
      parameters:
        - name: next
          in: query
          description: >
            Path to return to after signing in. Must be a rooted path within
            this app; anything absolute or scheme-relative is ignored in
            favour of the app root, so the callback cannot be used as an open
            redirect.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Short-lived sofalog_oidc flow cookie (state, nonce, PKCE verifier).
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /auth/oidc/callback:
    get:
      operationId: getAuthOIDCCallback
      summary: Single sign-on callback
      description: >
        The redirect URI registered with the provider — always
        `{BASE_URL}/api/v1/auth/oidc/callback`. Verifies the ID token,
        resolves or provisions the account, creates the ordinary session
        cookie and redirects into the app.


        Failures also redirect, to `?sso_error=<code>`, rather than rendering
        an error envelope: the user arrived here by clicking a button, and
        JSON in the address bar is a dead end.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider when it refuses (e.g. access_denied).
          schema:
            type: string
      responses:
        "302":
          description: >
            Signed in — redirect into the app with the session cookie set; or,
            on failure, a redirect carrying ?sso_error=.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The HTTP-only sofalog_session cookie.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/users/{id}/email:
    put:
      operationId: putAuthUserEmail
      summary: Change an account's email
      description: >
        The email is the login identifier, so this changes how someone signs
        in. An admin may change anyone else's without knowing their password;
        changing your OWN requires `current_password`, the same rule the
        password change uses.


        An account with no local password (an SSO account) cannot change its
        own address — the identity provider owns it — but an admin still can.


        A wrong `current_password` is **422**, not 401: the request is
        authenticated, and 401 would read as session expiry to clients.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                current_password:
                  type: string
                  format: password
                  description: Required when changing your own address.
      responses:
        "204":
          description: The email was updated.
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another account already uses that address (code `conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/users/{id}/display-name:
    put:
      operationId: putAuthUserDisplayName
      summary: Set an account's display name
      description: >
        Sets or clears the human label shown in the UI. Your own, or anyone's
        if you are an admin. No password is required: the label is cosmetic,
        is not unique, and grants nothing.


        An empty string clears it, and clients fall back to the email's local
        part.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 64
      responses:
        "204":
          description: The display name was updated.
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"


  /auth/users/{id}/match-watchlist:
    put:
      operationId: putAuthUserMatchWatchlist
      summary: Allow or forbid matching your watchlist
      description: >
        Flips the "Allow matching watchlist" consent (D-028). While on, other
        users see this account in `/video/watchlist/match-users` and may name
        it in the watchlist's `match_user` filter — which only ever shows them
        the overlap with their OWN list, never this account's list. Default
        off.


        SELF ONLY. Unlike the display name and email there is no admin bypass:
        this is consent to be visible, and an admin cannot give it on someone
        else's behalf. Acting on another account is a 403 whoever you are.
        Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_watchlist]
              properties:
                match_watchlist:
                  type: boolean
      responses:
        "204":
          description: The setting was updated.
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/users/{id}/timezone:
    put:
      operationId: putAuthUserTimezone
      summary: Set your time zone
      description: >
        Sets the IANA zone this account's day is measured in (D-038), or clears
        it back to the server's `DEFAULT_TIMEZONE` with `null`. The zone
        decides what counts as aired (show completion, Up Next's `aired`, the
        status sweep), the upcoming calendar's default first day, the instant
        the bulk air-date modes stamp, and the zone the SPA renders every
        instant in. Every instant stays stored in UTC, so nothing already
        logged moves. An unknown name, an empty one and `Local` are a 422.


        SELF ONLY, like the matching consent: it moves the account's own day.
        Acting on another account is a 403 whoever you are. Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone:
                  type: string
                  nullable: true
                  example: Europe/Bucharest
      responses:
        "204":
          description: The zone was updated.
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /video/up-next:
    get:
      operationId: getUpNext
      summary: Up next to watch
      description: >
        The next episode to watch for every show the user has started —
        at least one episode watch, and not dropped. The next episode is the
        first non-special episode strictly after the highest watched position:
        after watching S1E2 the answer is S1E3, never S1E1, and a show with
        nothing after its highest watched episode is absent rather than
        wrapping around. An unaired or undated next episode is included with
        `aired: false` unless the release-date filters remove it. Sorting and
        filtering are server-side; an empty array is a valid response.
      parameters:
        - name: order_by
          in: query
          schema:
            type: string
            enum: [last_watched, show_name, air_date]
            default: last_watched
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: only_with_release_date
          in: query
          description: Only entries whose episode has an air date.
          schema:
            type: boolean
            default: false
        - name: only_released
          in: query
          description: >
            Only entries whose episode has aired (implies
            only_with_release_date).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Entries in the requested order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpNextEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/upcoming:
    get:
      operationId: getUpcoming
      summary: Upcoming calendar
      description: >
        The dated things this user is waiting for, in calendar order: every
        unwatched, dated, non-special episode of a show the user follows (a
        non-dropped show state — at least one episode watch) or has on their
        watchlist, plus every unwatched movie on their watchlist, within a
        window of `days` days starting at `from`. The window starts AT `from`
        — today's unwatched episode is listed and leaves once marked — and
        ends before `from + days`. Dropped shows are excluded even when
        watchlisted; undated episodes have no place on a calendar and are
        left out (Up Next surfaces them with its Upcoming badge). The list is
        flat and ordered by date, then title; clients group it by day. A pure
        local read — never a provider call, so never a 503. An empty array is
        a valid response.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, episode, movie]
            default: all
        - name: days
          in: query
          description: The horizon, in days from `from`.
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 90
        - name: from
          in: query
          description: >
            The first day of the window, YYYY-MM-DD. Defaults to the user's
            today in their time zone (D-038) — the same day the aired
            predicate behind completion and Up Next's `aired` flag uses. The
            SPA sends that same day explicitly.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Entries in calendar order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/stats:
    get:
      operationId: getStats
      summary: Watch and rating statistics
      description: >
        Every section of the Stats page for this user, for one period: all
        time, or one calendar year measured in the user's time zone (D-038).
        Without `period` the server applies the current year when it holds at
        least one play, else all time; the applied period is always echoed,
        together with the years the filter may offer. Every section is always
        present — one the page would hide is null (or an empty list where the
        section lists items), so the client decides visibility from the data.
        Every bucket (month, day, weekday, hour, streak) is the play's instant
        read in the user's zone. A pure local read over the user's own log,
        ratings and show states (D-039) — never a provider call, never a 503,
        and never another user's state.
      parameters:
        - name: period
          in: query
          description: >
            `all`, or a four-digit year. A year the `years` list does not
            offer is still computed and simply empty; a malformed value is a
            422.
          schema:
            type: string
            pattern: "^(all|[0-9]{4})$"
      responses:
        "200":
          description: The whole page for the applied period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/history:
    get:
      operationId: getHistory
      summary: Watch history by date
      description: >
        Reverse-chronological feed of what this user watched, one entry per row
        of the watch log. Because rewatches are real entries, the same target
        can legitimately appear more than once, and `id` (the watch-row id) is
        the only stable identity a client may key a list on.


        Entries are ordered by `watched_at` and then `id`, both following
        `order`, so entries sharing a month are contiguous and a client can
        group them into month sections with a single pass over adjacent
        entries. The `id` tie-break is not decorative: a bulk mark writes one
        `watched_at` to many rows. Because ordering is by UTC instant while a
        client groups by local month, group on the local-time value, not on a
        prefix of the raw string. The response is a bare array — paging arrives as the `limit`
        and `offset` query parameters, never as a wrapping envelope. Both are
        applied after ordering; a client that asked for `limit` N knows more
        entries may exist exactly when it received N back, and paging past the
        end returns an empty array, not an error.


        `target_type` plus `target_id` restrict the feed to every recorded
        watch of one item (e.g. the history list on a movie details page).
        They must be sent together: ids are unique only within their own
        table, so the pair identifies the target and an id alone identifies
        nothing. An id with no recorded watches yields an empty array.


        `season_id` and `show_id` are the other two narrowings: every watch of
        any episode in one season, or in one whole show across every season,
        interleaved — the history lists on the season and show details pages.
        Both are **scopes**, not targets: neither a season nor a show is ever
        itself watched, which is why neither is a `target_type` value. At most
        one narrowing may be sent — the target pair, `season_id` or `show_id` —
        and combining them is a 422, because they mean different things and
        silently picking a winner would hide the mistake. An unknown season or
        show id is a 404, unlike a target id with no watches: the row either
        exists or it does not.


        Entries come from the watch log itself, which carries both arms:
        `movie` and `episode` are a discriminated union keyed by
        `target_type`, exactly one non-null per entry. `type=episode` or an
        episode target filters to episode watches, and an id with nothing
        recorded against it yields an empty array rather than an error. A
        watch whose catalog row has since been deleted is omitted from the
        feed.
      parameters:
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: type
          in: query
          description: Restrict the feed to one kind of watched item.
          schema:
            type: string
            enum: [all, movie, episode]
            default: all
        - name: target_type
          in: query
          description: >
            With `target_id`, restrict the feed to one item's watches.
            Required whenever `target_id` is present.
          schema:
            type: string
            enum: [movie, episode]
        - name: target_id
          in: query
          description: >
            Catalog id of the target named by `target_type`. Required
            whenever `target_type` is present.
          schema:
            type: integer
            minimum: 1
        - name: season_id
          in: query
          description: >
            Local `seasons.id`. Restricts the feed to watches of that season's
            episodes — a scope rather than a target, and refused with a 422 if
            combined with any other narrowing. An unknown id is a 404.
          schema:
            type: integer
            minimum: 1
        - name: show_id
          in: query
          description: >
            Local `shows.id`. Restricts the feed to watches of that show's
            episodes, across every season — a scope rather than a target, and
            refused with a 422 if combined with any other narrowing. An unknown
            id is a 404.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Maximum entries to return, applied after ordering.
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          description: Entries to skip before the first returned one.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Entries in the requested order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/search:
    get:
      operationId: searchVideo
      summary: Search TMDB for movies and shows
      description: >
        Live TMDB search — the entry point for adding movies and shows.
        Results are ephemeral: nothing here is written to the library, and the
        same query can return different results tomorrow. First results page
        only. With `type=all` the two TMDB lists are merged by popularity
        (descending) and capped at 20; a single-type search keeps TMDB's own
        relevance order. Requires a configured TMDB credential — without one
        this endpoint (and only endpoints like it) returns 503, and the
        library keeps working.
      parameters:
        - name: q
          in: query
          required: true
          description: Search text. Must be non-blank.
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, show]
            default: all
      responses:
        "200":
          description: Matches, best first. Empty array when nothing matched.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/trending:
    get:
      operationId: getTrending
      summary: What is trending on TMDB today or this week
      description: >
        TMDB's trending list, served live on every call and never stored
        (D-034): the person page's rule with no tracked half — there is no
        catalog row to be over, so a TMDB outage is a 503 on every view, and
        the library is unaffected. With `type=all` the list is TMDB's own
        cross-type ranking (`/trending/all`) with the people it ranks
        alongside dropped, so a page can come up a few short of twenty; a
        single type reads that type's list in TMDB's order. Every entry is
        marked against the caller's library by a local join — `id` names the
        catalog row when the library holds the title, `watched` and
        `in_history` are this user's — never a second provider call. One TMDB
        page per call; `page` walks TMDB's own paging, and there is more while
        `page < total_pages`. TMDB offers no filters on this list, so neither
        does this route — the filters live on `/video/discover`.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [day, week]
            default: day
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, show]
            default: all
        - $ref: "#/components/parameters/ListPage"
      responses:
        "200":
          description: One page of entries in TMDB's trending order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/discover:
    get:
      operationId: getDiscover
      summary: Browse TMDB's catalog, filtered and sorted
      description: >
        TMDB's `/discover` lists, served live on every call and never stored
        (D-034) — the same rule as `/video/trending`. With no filter and the
        default sort this is TMDB's popular list. Every filter is applied by
        TMDB itself, so a page stays full. TMDB publishes movies and shows as
        two separate lists, so `type=all` is both kinds' page merged by the
        chosen sort's own key and NOT capped (up to 40 entries), because a cap
        would drop titles no later page brings back; a single type keeps
        TMDB's native order. Two defaults keep the orders honest:
        `sort=rating` with no `votes_min` applies a floor of 200 votes (TMDB's
        own site does the same), and `sort=newest` caps the date at today so
        announced titles do not lead. `genre` and `provider` are repeated,
        `?genre=18&genre=80`, never comma-joined: every listed genre must
        match, any listed provider may. A provider filter is the one call
        that sends the configured `TMDB_WATCH_REGION` to TMDB, as
        `watch_region`. Entries carry the same library marks as the trending
        list.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, show]
            default: all
        - name: sort
          in: query
          description: >
            `popularity` is TMDB's popular order; `rating` its community
            score; `newest` the release / first-air date; `votes` the vote
            count.
          schema:
            type: string
            enum: [popularity, rating, newest, votes]
            default: popularity
        - $ref: "#/components/parameters/ListPage"
        - name: vote_min
          in: query
          description: Minimum TMDB community score, 0–10.
          schema:
            type: number
            minimum: 0
            maximum: 10
        - name: vote_max
          in: query
          description: Maximum TMDB community score, 0–10; not below `vote_min`.
          schema:
            type: number
            minimum: 0
            maximum: 10
        - name: votes_min
          in: query
          description: Minimum number of TMDB votes.
          schema:
            type: integer
            minimum: 0
        - name: language
          in: query
          description: Original language, ISO 639-1 (`en`, `ro`).
          schema:
            type: string
            pattern: "^[a-z]{2}$"
        - name: year_from
          in: query
          description: Earliest release / first-air year, 1870–2100.
          schema:
            type: integer
        - name: year_to
          in: query
          description: Latest release / first-air year; not below `year_from`.
          schema:
            type: integer
        - name: genre
          in: query
          description: >
            TMDB genre ids a title must ALL carry. Repeated per id, never
            comma-joined. At most 20. The ids come from `/video/discover/options`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: integer
              format: int64
              minimum: 1
        - name: provider
          in: query
          description: >
            TMDB watch-provider ids; a title on ANY of them in the server's
            watch region matches. Repeated per id, never comma-joined. At most
            20. The ids come from `/video/discover/options`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        "200":
          description: One page of entries in the chosen order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/discover/options:
    get:
      operationId: getDiscoverOptions
      summary: The Discover filter panel's option lists
      description: >
        TMDB's genre lists per kind, its language list, and the streaming
        services it knows in the server's watch region — what the filter
        panel offers. Live from TMDB like the lists themselves (D-034), cached
        server-side for the process lifetime, shared by every user. A TMDB
        outage is a 503; the Discover grid itself does not depend on this
        call.
      responses:
        "200":
          description: The option lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/movies/details:
    get:
      operationId: getMovieDetails
      summary: One movie's full details, live or from the local catalog
      description: >
        Exactly one of `tmdb_id` and `id` must be given — they are different id
        namespaces and are never interchangeable. A `tmdb_id` with no catalog
        row is served live from TMDB and stores nothing: viewing never creates
        catalog rows, tracking does (D-015) — such a response carries `id:
        null` and `tracked: false`, and is the only case that can 503 on a
        provider outage. A movie with a catalog row is served from its stored
        snapshot; one older than 2 days is refreshed from TMDB on view, and if
        that refresh fails the stale snapshot is served, so a tracked movie
        never yields a 503. Looking up by `id` is local only — a miss is a
        plain 404 and never touches TMDB. Runs as the implicit user until
        sessions exist (M1); `watched`/`watchlisted` are that user's state.
      parameters:
        - name: tmdb_id
          in: query
          description: TMDB movie id, as carried by a SearchResult.
          schema:
            type: integer
            format: int64
        - name: id
          in: query
          description: Local catalog id (`movies.id`).
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The movie's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/shows/details:
    get:
      operationId: getShowDetails
      summary: One show's full details, from its snapshot or live
      description: >
        Exactly the movie view's three branches (D-015):


        * `id=` with no row — a plain 404, and never a TMDB call.

        * `tmdb_id` with a row (the show is tracked) — the stored snapshot;
          one older than two days is refreshed synchronously, and if that
          refresh fails the STALE snapshot is served and the failure logged. A
          tracked show never 503s.

        * `tmdb_id` with no row (untracked) — served live from `/tv/{id}` and
          storing nothing, with `id: null` and `tracked: false`. A provider
          outage here IS a 503: there is no snapshot to fall back on.


        Exactly one of `id` and `tmdb_id`. Seasons ride the show root at TMDB,
        so the whole seasons grid comes from one call — there is no request per
        season, and no episode list. Each season entry carries the local
        `seasons.id` once a season snapshot row exists (null before then).


        A refresh that finds a season the show did not have before materialises
        it; existing seasons and episodes are NOT re-fetched here, because that
        would make a routine page load cost one call per season. Their freshness
        belongs to the season view and to the scheduled air-date refresh (D-006).


        `watchlisted` is this user's row in `user_video_watchlist` — an
        independent axis, never a status (D-011), so it is orthogonal to both
        `status` and `watched`.
      parameters:
        - name: id
          in: query
          description: >
            Local `shows.id`, which a show has once it is tracked. Mutually
            exclusive with `tmdb_id`; a miss is a 404 and never a provider call.
          schema:
            type: integer
            format: int64
        - name: tmdb_id
          in: query
          description: TMDB show id, as carried by a SearchResult.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The show's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/seasons/details:
    get:
      operationId: getSeasonDetails
      summary: One season's full details, incl. the episode list
      description: >
        Addressed by local `id`, or by the SHOW's `tmdb_id` plus `season`
        together — exactly one of the two forms. Exactly the movie and show
        views' three branches (D-015). By tmdb key with the show UNTRACKED: one
        `/tv/{id}` call with the season appended, served live and STORING
        NOTHING, so `id` comes back null and an outage here is a 503. By tmdb
        key with the show TRACKED but the season absent — TMDB gained a season
        since the show was written — the season is materialised and linked with
        its episodes. A row fresher than 48 hours is served as-is with no
        provider call; a stale row refreshes on view and falls back to the
        stale snapshot when TMDB is down, so a season with a row never 503s. By
        `id`, a missing row is a plain 404 and never a TMDB call.
      parameters:
        - name: id
          in: query
          required: false
          description: Local season id. Mutually exclusive with the tmdb pair.
          schema:
            type: integer
            format: int64
        - name: tmdb_id
          in: query
          required: false
          description: TMDB SHOW id (not the season's own TMDB id).
          schema:
            type: integer
            format: int64
        - name: season
          in: query
          required: false
          description: Season number; 0 is Specials. Requires `tmdb_id`.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The season's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/episodes/details:
    get:
      operationId: getEpisodeDetails
      summary: One episode's details
      description: >
        An episode is one entry in its season's snapshot — there is no
        episodes catalog table until M2, and this endpoint creates none. The
        season is addressed exactly as `/video/seasons/details` addresses it:
        by local `season_id`, or by the SHOW's `tmdb_id` plus `season`
        together — exactly one of the two forms — plus `episode`, which both
        forms require. Resolving the season inherits that endpoint's whole
        contract: an untracked show's season is fetched live and stored
        nowhere (so `season_id` comes back null), a tracked show's missing
        season is materialised, a row fresher than 48 hours is served with no
        provider call, a stale one refreshes and falls back to the stale
        snapshot when TMDB is down, and a `season_id` with no row is a plain
        404 and never a TMDB call. So 503 occurs only when the show is
        untracked AND TMDB is unreachable; a season with a row never 503s. An
        `episode` the resolved season does not list is a 404.
      parameters:
        - name: season_id
          in: query
          required: false
          description: Local season id. Mutually exclusive with the tmdb pair.
          schema:
            type: integer
            format: int64
        - name: tmdb_id
          in: query
          required: false
          description: TMDB SHOW id (not the season's own TMDB id).
          schema:
            type: integer
            format: int64
        - name: season
          in: query
          required: false
          description: Season number; 0 is Specials. Requires `tmdb_id`.
          schema:
            type: integer
            minimum: 0
        - name: episode
          in: query
          required: true
          description: >
            Episode number within the season. 0 is valid — a show may number a
            pilot or a recap 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The episode's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/people/details:
    get:
      operationId: getPersonDetails
      summary: One person's details, live from TMDB
      description: >
        The page a cast card links to: portrait, biography and acting credits
        (D-027). A person has no catalog table, no snapshot and no per-user
        state, so this is the details views' rule (D-015) with no tracked
        half: EVERY view is fetched live from TMDB
        (`/person/{id}?append_to_response=combined_credits,external_ids`) and
        stored nowhere, and TMDB being unreachable is a 503 on every view —
        the one read route that always can. The filmography is marked against
        the caller's library locally: each credit the catalog holds carries
        its local `id` and this user's `watched` (movie: any watch in the log;
        show: completed), from a join by TMDB id — never a second provider
        call. Addressed by `tmdb_id` only; a person never has a local id. An
        unknown id is TMDB's 404.
      parameters:
        - name: tmdb_id
          in: query
          required: true
          description: TMDB person id, as `CastMember.tmdb_id` carries it.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The person's details, always fresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/watches:
    post:
      operationId: markWatched
      summary: Record a watch of a movie or an episode
      description: >
        Two modes, chosen by the request itself. **Without `watched_at`** this
        is the first-watch mark and is idempotent: the row is inserted only if
        this user has never watched the target, so a double tap or retry
        returns `created: false` and writes nothing. **With `watched_at`** it is
        the deliberate log of one viewing at one instant (D-009) — it always
        inserts, so `created` is always `true` and the same target can
        accumulate rows. The instant may be in the past; a value in the future
        is a 422.


        An optional `rating` is stored in the same transaction, so "I watched
        it and thought this" cannot half-succeed — and, for a user who has
        linked their TMDB account, queued for the one-way push (D-029).


        A `tmdb_id` with no catalog row materialises it from
        TMDB first (tracking is what creates rows, D-015); if TMDB is down at
        that moment the call is a 503 and nothing is written. Tracking also
        enqueues the target's full media set for download into permanent local
        storage, so its details page works with TMDB down. The watch and the
        recomputed status are one transaction.


        For an **episode**, `tmdb_id` is the SHOW's and must be accompanied by
        `season` and `episode`. Materialising then pulls down the WHOLE show —
        every season and every episode row, and every season poster and episode
        still — which is one TMDB call per season and can take several seconds
        the first time. Marking an episode sets the show to `watching`, or to
        `watched` once every aired, non-special episode is watched (D-012); the
        recomputed status and derived progress come back in `show`.


        A `target_type` of `show` is a **422** here, pointing at
        `/video/watches/bulk`: marking a whole show is a bulk operation whose
        answer is a count, not this endpoint's boolean.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The watch was recorded (or already existed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResult"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/watches/bulk:
    post:
      operationId: bulkMarkWatched
      summary: Mark every aired, non-special episode of a show or season watched
      description: >
        SPEC §6's "mark whole show watched" and "mark whole season watched",
        each specified as a single call rather than a loop of per-episode
        requests: one INSERT … SELECT covers every aired, non-special episode
        (D-012) in the scope — the whole show, or one season — and the show's
        status is recomputed ONCE for the whole batch. The scope names the
        target's type: scope `show` takes a show target, scope `season` a
        season target, and a season's response still reports the OWNING SHOW's
        status and progress (a season has no status of its own, and marking one
        season can complete the show). Season 0 — Specials — is refused with a
        422: those episodes never gate completion.


        Idempotent set-wise by default — episodes this user has already watched
        are skipped, so running it twice returns `created: 0` and writes
        nothing, and a double tap can never be mistaken for a few hundred
        deliberate rewatches. `rewatch: true` is the deliberate exception: every
        eligible episode gets a NEW row, watched ones included — D-009's dated
        log applied set-wise, and like that log it is NOT idempotent, so the
        client's pending state is the double-tap guard.


        `watched_at_mode` chooses each row's instant. `now` (the default) and
        `fixed` share one instant — the request time, or the required
        `watched_at`. `episode_air` dates each row from its episode's own air
        date and `season_air` from its season's premiere, both as midnight in
        the user's time zone stored as its UTC instant (D-038) — for a user in
        Bucharest, `2026-08-19` becomes `2026-08-18T21:00:00Z`, which renders
        as 00:00 on the air date. "Aired" is likewise measured against the
        user's day. Eligibility guarantees every markable episode
        an air date; a season's premiere can be missing or not itself aired, and
        those episodes take `watched_at` as a fallback — required in that case,
        or the call is a 422 and nothing is written. Backdating in any form
        moves `watched_at` and nothing else: the aired predicate and the state
        row's timestamp keep the real clock.


        A `tmdb_id` with no catalog row materialises the whole show first, which
        is one TMDB call per season; if TMDB is down at that moment the call is
        a 503 and nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkWatchRequest"
      responses:
        "200":
          description: >
            How many watches were written, plus the show's recomputed status and
            derived progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkWatchResult"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/watches/{id}:
    delete:
      operationId: deleteWatch
      summary: Remove one watch from the log
      description: >
        The correction path for a mis-marked or duplicated watch. Purely local:
        never a provider call.


        **Not idempotent**, unlike the watchlist and rating deletes. Those mean
        "ensure this target is not in the set"; this one names a single row by
        its own identity, so deleting it twice is a 404 rather than a second
        success. A row belonging to another user is the same 404 — the id alone
        never grants access to it.


        The delete and the status it implies are one transaction. Removing the
        last watch is therefore visible immediately: a movie loses its state row
        and reads unwatched again, a show falls back to `watching` or loses its
        row too, and a user-set `dropped` survives because it is intent rather
        than a derivation. Because progress is always derived, nothing else
        needs correcting.


        The catalog row and its stored artwork stay even when this was the last
        reference: untracking never hard-deletes (D-008), and the deferred sweep
        collects unreferenced items once it lands.
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The watch-row id — `HistoryEntry.id` from the history feed, which is
            the only stable identity an entry has. This is **not** a target id:
            a rewatch repeats the target and would be ambiguous.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: The watch was removed and the target's status recomputed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/watchlist:
    get:
      operationId: getWatchlist
      summary: The watchlist
      description: >
        Everything this user has put on their watchlist, one entry per row of
        the watchlist table. The watchlist is an independent axis, never a
        status (D-011): an entry can carry `watched: true` and that is the
        feature, not an inconsistency.


        Unlike the history feed, the list holds at most one row per target, so
        an entry's target id is a stable identity a client may key a list on
        and no item ever appears twice.


        Entries are ordered by `order_by` and then by the target's
        (`target_type`, id) pair, all following `order`. That tie-break is not
        decorative: adding several items in one sitting writes one `added_at` to
        many rows, two items can share a date or a title, and a movie and a show
        can share an id. Titles sort case-insensitively, and a show sorts on its
        `name`. An item with no date sorts LAST under `order_by=release_date`
        in BOTH directions, rather than leading an ascending page. Because
        `added_at` is a UTC instant while a client groups by local time, group
        on the local-time value, not on a prefix of the raw string. The
        response is a bare array — paging arrives as the `limit` and `offset`
        query parameters, never as a wrapping envelope. Both are applied after
        ordering; a client that asked for `limit` N knows more entries may
        exist exactly when it received N back, and paging past the end returns
        an empty array, not an error.


        The list holds movies and shows, interleaved and ordered together. A
        show has no `release_date` of its own, so `order_by=release_date` sorts
        it on its FIRST AIR DATE. An entry whose catalog row has since been
        deleted is omitted from the list.


        `match_user` narrows the list to what this user and EVERY named user
        have watchlisted — an intersection, not a union (D-028). It is
        repeated, `?match_user=3&match_user=7`, never comma-joined. Only an
        account that has turned "Allow matching watchlist" on may be named
        (see `/video/watchlist/match-users`); naming yourself, a duplicate, an
        unknown id, or a user who is not sharing is a 422 — so a user who
        switched sharing off after being picked surfaces as an error the
        client can act on, not as an empty list that reads as "nothing in
        common". The entries stay THIS user's: `added_at`, `user_rating` and
        `watched` are the caller's own, and nothing about the other users'
