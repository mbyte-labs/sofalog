        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      operationId: addFavorite
      summary: Mark a movie or show as a favorite
      description: >
        Favorites are an independent axis, never a status (D-030) — a title
        can be a favorite and unwatched, in progress, finished or dropped at
        once, and favoriting alone sets no watch status. Idempotent: re-adding
        returns `created: false`. A favorite is a tracking action: the same
