  /video/shows/{id}/drop:
    post:
      operationId: dropShow
      summary: Drop a show
      description: >
        Records `dropped`, the one watch status that is user intent rather than
        a derivation (D-010). Sticky: no recompute, no newly aired episode and
        no later watch clears it — only `DELETE` on this path does. A dropped
        show is excluded from Up Next (`GET /video/up-next`).


        Only a show the user has STARTED can be dropped. Without at least one
        episode watch there is no state row, and a drop that created one would
        invent a watch status for a show never begun — that case is a 422,
        exactly as watchlisting and rating deliberately leave the status absent.


        Idempotent: dropping an already-dropped show answers `changed: false`,
        writes nothing and leaves `updated_at` alone. Unlike watchlisting or
        recording a copy this is NOT a tracking action (D-015) — it addresses a
        show that is already local by its own id, never a `tmdb_id`, so it
        cannot call a provider and cannot 503.
      parameters:
        - name: id
          in: path
          required: true
          description: Local `shows.id`.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The show is dropped (newly or already).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
