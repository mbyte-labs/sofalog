      operationId: undropShow
      summary: Un-drop a show
      description: >
        Releases the drop and recomputes the status from the watch log in the
        same transaction, so a show dropped after finishing comes back as
        `watched` rather than `watching`, and one whose watches have since been
        deleted loses its state row entirely.


        Idempotent — un-dropping a show that is not dropped is a success that
        changed nothing, and skips the recompute, because this operation may
        only ever release a drop and never rewrite a status the user did not
        set. Purely local: never a provider call.


        Answers 200 with the recomputed state rather than the 204 the watchlist,
        rating and copy removals use: which status the recompute lands on is not
        derivable on the client (D-010 — the label is the server's to state).
      parameters:
        - name: id
          in: path
          required: true
          description: Local `shows.id`.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The show is not dropped (any more).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /video/copies:
    post:
      operationId: addCopy
      summary: Record an owned copy of a movie or season
      description: >
        Owned copies are an independent per-user axis like the watchlist
        (D-011): which formats or services the user holds an item on. A copy is
        a reference (D-008) and a tracking action (D-015) — adding one to an
        untracked target addressed by `tmdb_id` materialises its catalog row
        and queues its full asset set, which can take seconds and is a 503 with
        nothing written when TMDB is down. Idempotent: re-adding a kind the
        target already carries returns `created: 0`.


        Copies are stored per movie and PER-SEASON (D-021). `target_type` is
        `movie`, `season`, or `show` — but `show` is a bulk fan-out SCOPE, not
        a stored target: a show-scoped add writes one row per NON-SPECIAL
        season the show has, skipping seasons that already carry the kind, and
        `created` reports how many rows landed. Season 0 never rides a
        show-level action; a Specials copy is added by addressing that season
        directly. A `season` target takes either its local `target_id` or the
        show's `tmdb_id` plus `season`; an `episode` target is refused — nobody
        shelves one episode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRequest"
      responses:
        "200":
          description: The copy (or copies, for a show scope) is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyResult"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /video/copies/{target_type}/{target_id}/{kind}:
    delete:
      operationId: removeCopy
      summary: Remove an owned copy of a movie or season
      description: >
        Idempotent — removing a kind that is not held is still a 204 — and
        purely local: never a provider call. A `show` scope removes the kind
        from every NON-SPECIAL season, mirroring the fan-out add; a Specials
        copy is removed by addressing that season directly. The catalog row and
        its stored artwork stay even when this was the last reference (D-008).
      parameters:
        - name: target_type
          in: path
          required: true
          description: >
            Which table `target_id` belongs to — or `show` as the bulk scope.
            The pair identifies the target; the id alone identifies nothing,
            because movie 5 and season 5 both exist.
          schema:
            type: string
            enum: [movie, season, show]
        - name: target_id
          in: path
          required: true
          description: Local catalog id (`movies.id`, `seasons.id` or `shows.id`).
          schema:
            type: integer
            format: int64
        - name: kind
          in: path
          required: true
          description: The copy kind to remove.
